<!DOCTYPE html>

<head>

<link rel="icon" type="image/x-icon" href="https://github.com/cdtechdigital/images/blob/main/Zoho%20Icon.png?raw=true">

    <style>
        /* Modern Reset & Architectural Layer Hardening */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        html, body {
            height: 100%;
            width: 100%;
        }

        body {
            background: linear-gradient(135deg, #f3f5f8 0%, #e1e6ef 50%, #f3f5f8 100%);
            position: relative;
            overflow-x: hidden;
            overflow-y: auto;
        }

        body::before {
            content: "";
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, rgba(255,255,255,0.4) 25%, transparent 25%),
                        linear-gradient(-45deg, rgba(255,255,255,0.4) 25%, transparent 25%);
            background-size: 60px 60px;
            opacity: 0.15;
            z-index: 0;
            pointer-events: none;
        }

        /* Hard Centering Gating Module: Enforces layout equilibrium */
        .gateway-card {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            width: calc(100% - 40px);
            max-width: 1000px;
            height: 480px;
            background-color: #ffffff;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.06), 0 2px 12px rgba(0, 0, 0, 0.03);
            border-radius: 4px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            overflow: hidden;
        }

        /* Vertical partition divider between the two columns */
        .gateway-card::after {
            content: "";
            position: absolute;
            top: 0;
            bottom: 0;
            left: 50%;
            width: 1px;
            background-color: #f1f3f6;
            z-index: 2;
        }

        /* Centered Interior Content Layout Blocks */
        .column {
            padding: 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
            height: 100%;
        }

        .left-column {
            background-color: #ffffff;
            align-items: stretch;
        }

        .form-container {
            width: 100%;
            max-width: 380px;
            margin: 0 auto;
        }

        .form-header {
            margin-bottom: 20px;
        }

        .form-header h2 {
            color: #2c3e50;
            font-size: 1.4rem;
            font-weight: 600;
            letter-spacing: -0.5px;
        }

        .form-group {
            margin-bottom: 14px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #7f8c8d;
            font-size: 0.8rem;
            font-weight: 500;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .form-group input, 
        .form-group textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #dcdde1;
            border-radius: 4px;
            background-color: #fcfcfd;
            color: #2f3640;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s ease-in-out;
        }

        .form-group input:focus, 
        .form-group textarea:focus {
            border-color: #1a96ff;
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(26, 150, 255, 0.15);
        }

        .form-group textarea {
            resize: none;
            min-height: 80px;
        }

        /* Precise match of the functional blue button property from your design assets */
        .action-btn {
            width: 100%;
            padding: 14px;
            background-color: #1a96ff;
            color: #ffffff;
            border: none;
            border-radius: 4px;
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
            box-shadow: 0 2px 4px rgba(26, 150, 255, 0.1);
            margin-top: 5px;
        }

        .action-btn:hover {
            background-color: #0084f4;
        }

        .action-btn:active {
            transform: scale(0.99);
        }

        .right-column {
            background-color: #ffffff;
            text-align: center;
            justify-content: center;
            align-items: center;
        }

        .illustration-box {
            width: 100%;
            max-width: 240px;
            margin-bottom: 25px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .illustration-box svg {
            width: 100%;
            height: auto;
        }

        .text-header {
            color: #111111;
            font-size: 1.05rem;
            font-weight: 600;
            margin-bottom: 12px;
            letter-spacing: -0.2px;
        }

        .text-description {
            color: #555555;
            font-size: 0.85rem;
            line-height: 1.5;
            max-width: 300px;
            margin-bottom: 20px;
        }

        .link-text {
            color: #1a96ff;
            font-size: 0.85rem;
            font-weight: 500;
            text-decoration: none;
        }

        .link-text:hover {
            text-decoration: underline;
            color: #0084f4;
        }

        .carousel-indicator {
            display: flex;
            gap: 6px;
            margin-top: 25px;
        }

        .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background-color: #e2e8f0;
        }

        .dot.active {
            width: 16px;
            background-color: #1a96ff;
            border-radius: 4px;
        }

        /* Fluid layout override configuration for restricted mobile screen spaces */
        @media (max-width: 768px) {
            .gateway-card {
                grid-template-columns: 1fr;
                position: relative;
                top: 0;
                left: 0;
                transform: none;
                margin: 20px auto;
                height: auto;
            }
            .gateway-card::after {
                display: none;
            }
            .column {
                padding: 40px 20px;
                height: auto;
            }
            .left-column {
                order: 2;
            }
            .right-column {
                border-bottom: 1px solid #f1f3f6;
                order: 1;
            }
        }
    </style>
</head>
