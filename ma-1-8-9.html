<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>189邮箱</title>
    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
}

/* Top Transparent Ribbon Toolbar Navigation Line */
.navbar {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 24px 80px;
    background-color: transparent;
    z-index: 100;
}

.brand-logo-area h1 {
    color: #ffffff;
    font-size: 32px;
    font-weight: bold;
    letter-spacing: -0.5px;
    text-shadow: 0 2px 4px rgba(0,0,0,0.15);
}

.nav-links {
    font-size: 13px;
    display: flex;
    gap: 16px;
}

.nav-links a {
    color: rgba(255, 255, 255, 0.85);
    text-decoration: none;
    text-shadow: 0 1px 2px rgba(0,0,0,0.2);
}

.nav-links a:hover {
    color: #ffffff;
    text-decoration: underline;
}

/* Main Workspace with full screen panoramic landscape backdrop seamlessly tracking screenshot structure */
.workspace-area {
    flex-grow: 1;
    min-height: 100vh;
    background: linear-gradient(rgba(0, 0, 0, 0.1), rgba(0, 0, 0, 0.15)), 
                url('https://unsplash.com') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 120px 10% 100px;
    position: relative;
}

/* Left Column: Floating Time Widget Panel */
.time-widget-panel {
    display: flex;
    flex-direction: column;
    gap: 14px;
    color: #ffffff;
    text-shadow: 0 4px 12px rgba(0,0,0,0.3);
}

.time-display {
    font-size: 72px;
    font-weight: 300;
    line-height: 1;
}

.time-display .am-pm {
    font-size: 16px;
    vertical-align: top;
    margin-left: 4px;
    font-weight: bold;
}

.weather-row {
    display: flex;
    align-items: center;
    gap: 16px;
}

.sun-icon {
    font-size: 32px;
    filter: drop-shadow(0 2px 8px rgba(255,200,0,0.5));
}

.carousel-controls {
    display: flex;
    gap: 4px;
}

.control-btn {
    width: 24px;
    height: 24px;
    border: 1px solid rgba(255, 255, 255, 0.6);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 14px;
    cursor: pointer;
    background-color: rgba(0,0,0,0.2);
    user-select: none;
    transition: background-color 0.2s;
}

.control-btn:hover {
    background-color: rgba(255,255,255,0.2);
}

/* Right Column: White Floating Credentials Panel Card Component Box */
.login-card {
    background-color: #ffffff;
    width: 100%;
    max-width: 400px;
    border-radius: 4px;
    box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    padding: 0;
    overflow: hidden;
}

/* Custom dual-mode tab selection ribbon components border track */
.login-tabs {
    display: flex;
    border-bottom: 1px solid #eef2f5;
    background-color: #ffffff;
}

.tab-item {
    flex: 1;
    padding: 20px 10px;
    text-align: center;
    font-size: 16px;
    color: #666666;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    font-weight: 500;
}

.tab-item.active {
    color: #0066cc;
    border-bottom: 2px solid #0066cc;
}

.tab-icon {
    font-size: 16px;
}

form {
    padding: 36px 32px 28px;
    width: 100%;
}

.form-group {
    margin-bottom: 18px;
    width: 100%;
}

/* Pristine wide input border frames */
.form-control {
    width: 100%;
    height: 44px;
    border: 1px solid #cbd5e1;
    border-radius: 2px;
    padding: 0 14px;
    font-size: 14px;
    color: #333333;
    outline: none;
}

.form-control:focus {
    border-color: #0066cc;
}

.form-control::placeholder {
    color: #a0aec0;
    font-weight: 400;
}

/* Custom internal interactive layout positioning hooks for secure entry field */
.secure-wrapper {
    position: relative;
}

.secure-wrapper .form-control {
    padding-right: 64px;
}

.clear-icon, .eye-toggle {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    color: #94a3b8;
    font-size: 14px;
    user-select: none;
    z-index: 10;
}

.clear-icon {
    right: 36px;
}

.eye-toggle {
    right: 14px;
}

/* Crisp wide rectangular solid blue action submission trigger capsule button */
.submit-btn {
    position: relative;
    z-index: 20;
    width: 100%;
    background-color: #0066ff;
    color: #ffffff;
    border: none;
    height: 46px;
    font-size: 16px;
    font-weight: 500;
    letter-spacing: 4px;
    border-radius: 2px;
    cursor: pointer;
    margin-top: 6px;
    margin-bottom: 24px;
    transition: background-color 0.15s ease;
}

.submit-btn:hover {
    background-color: #0052cc;
}

/* Legal text data acceptance check block framework element rules layout strings */
.agreement-row {
    display: flex;
    align-items: flex-start;
    gap: 6px;
    font-size: 12px;
    color: #666666;
    line-height: 1.5;
    text-align: left;
}

.agreement-row input {
    margin-top: 3px;
    accent-color: #0066ff;
}

.agreement-row label a {
    color: #0066cc;
    text-decoration: none;
}

.agreement-row label a:hover {
    text-decoration: underline;
}

/* Card bottom secondary option helper connections line strip navigation area component */
.card-footer-ribbon {
    background-color: #f8fafc;
    border-top: 1px solid #edf2f7;
    padding: 16px 32px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
}

.sms-login {
    color: #666666;
    text-decoration: none;
}

.right-links {
    color: #cbd5e1;
}

.right-links a {
    color: #666666;
    text-decoration: none;
    margin: 0 4px;
}

.sms-login:hover, .right-links a:hover {
    color: #0066cc;
    text-decoration: underline;
}

/* Base Fine-Print Legal Framework Corporate Watermark Ribbon Panel Area components */
.page-footer {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 24px 80px;
    background: linear-gradient(to top, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
    color: rgba(255, 255, 255, 0.7);
    font-size: 12px;
    z-index: 10;
}

.footer-left {
    display: flex;
    flex-direction: column;
    gap: 8px;
}

.footer-left a {
    color: rgba(255, 255, 255, 0.7);
    text-decoration: none;
}

.footer-left a:hover {
    color: #ffffff;
}

.ct-cloud {
    margin-left: 12px;
    opacity: 0.9;
}

.copyright-line {
    font-size: 11px;
    opacity: 0.6;
}

.footer-right {
    text-align: right;
    line-height: 1.6;
    opacity: 0.7;
}

@media (max-width: 960px) {
    .navbar {
        padding: 24px 30px;
    }
    .workspace-area {
        flex-direction: column;
        justify-content: center;
        gap: 60px;
        padding: 120px 20px 140px;
    }
    .time-widget-panel {
        text-align: center;
        align-items: center;
    }
    .login-card {
        max-width: 100%;
    }
    .page-footer {
        flex-direction: column;
        align-items: center;
        text-align: center;
        gap: 16px;
        padding: 20px;
    }
    .footer-right {
        text-align: center;
    }
}

    </style>
